    .car-btn { position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; width: 42px; height: 42px; border-radius: 999px;

  <script>
    // ============================================================
    // 1. AMBIL DATA UNDANGAN
    //    ?u=...&s=...  link resmi dari admin (bertanda tangan)
    //    ?id=slug      link pendek dari undangan-data.js (opsional)
    //    ?preview=1    pratinjau klien sebelum bayar
    //    ?demo=tema    contoh desain        &to=Nama  nama tamu di sampul
    // ============================================================
    const params = new URLSearchParams(location.search);
    const UNS = (id, w = 900) => `https://images.unsplash.com/${id}?w=${w}&auto=format&fit=crop&q=80`;
    const DEMO_COVERS = ['photo-1583939003579-730e3918a45a','photo-1519741497674-611481863552','photo-1511285560929-80b456fea0bc','photo-1532712938310-34cb3982ef74','photo-1520854221256-17451cc331bf','photo-1469371670807-013ccf25f16a','photo-1606800052052-a08af7148866','photo-1522673607200-164d1b6ce486','photo-1544077960-604201fe74bc','photo-1518895949257-7621c3c786d7'];

    function demoData(themeId) {
      const idx = Math.max(0, DAFTAR_TEMA.findIndex(t => t.id === themeId));
      const d = new Date(); d.setDate(d.getDate() + 45);
      while (d.getDay() !== 6) d.setDate(d.getDate() + 1);
      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const y = d.getFullYear();
      return {
        theme: themeId,
        bride: 'Moniqa', brideParents: 'Putri dari Bpk. Ahmad & Ibu Siti', bridePhoto: UNS('photo-1494790108377-be9c29b29330', 600), brideIg: 'moniqa',
        groom: 'Fauzi', groomParents: 'Putra dari Bpk. Hasan & Ibu Aminah', groomPhoto: UNS('photo-1507003211169-0a1dd7228f2d', 600), groomIg: 'fauzi',
        coverPhoto: UNS(DEMO_COVERS[idx % DEMO_COVERS.length]),
        events: [
          { name: 'Akad Nikah', iso, date: formatTanggalPanjang(iso), time: '08.00 – 10.00 WIB', venue: 'Hotel Cianjur', mapsUrl: '' },
          { name: 'Resepsi', iso, date: formatTanggalPanjang(iso), time: '11.00 – 15.00 WIB', venue: 'Hotel Cianjur', mapsUrl: '' }
        ],
        gifts: [{ bank: 'Bank Contoh', acc: '1234567890', holder: 'Fauzi' }],
        story: [
          { year: String(y - 6), title: 'Pertama Bertemu', text: 'Berawal dari satu kelas yang sama di kampus, kami mulai saling mengenal.' },
          { year: String(y - 1), title: 'Lamaran', text: 'Dengan restu kedua keluarga, kami memutuskan melangkah lebih serius.' },
          { year: String(y), title: 'Hari Bahagia', text: 'Kami memulai babak baru, bersama — dan ingin berbagi bahagia denganmu.' }
        ],
        gallery: [0, 2, 4, 6, 8, 1].map(i => UNS(DEMO_COVERS[(idx + i) % DEMO_COVERS.length], 600)),
        dress: 'Nuansa earth tone / pastel',
        stream: '',
        turut: 'Keluarga Besar Bpk. Ahmad\nKeluarga Besar Bpk. Hasan',
        musicUrl: '', wa: ''
      };
    }
    function upgradeLegacy(o) {
      if (!o) return o;
      if (!o.events && (o.date || o.venue)) o.events = [{ name: 'Akad & Resepsi', date: o.date, time: o.time, venue: o.venue, mapsUrl: o.mapsUrl }];
      if (!o.gifts && o.bankAcc) o.gifts = [{ bank: o.bankName, acc: o.bankAcc, holder: o.bankHolder }];
      return o;
    }

    let MODE = 'demo', RAW = null;
    if (params.get('u')) { RAW = decodeUndangan(params.get('u')); if (RAW) MODE = 'live'; }
    // link tetap: undangan-data.js berisi "slug": ["isi", "tanda tangan"] dari admin.html
    let SIGNED = params.get('u') ? { u: params.get('u'), s: params.get('s') } : null;
    const ENTRI = !RAW && params.get('id') && typeof UNDANGAN_DATA !== 'undefined' ? UNDANGAN_DATA[params.get('id')] : null;
    if (Array.isArray(ENTRI)) { SIGNED = { u: ENTRI[0], s: ENTRI[1] }; RAW = decodeUndangan(ENTRI[0]); if (RAW) MODE = 'live'; }
    else if (ENTRI) { RAW = upgradeLegacy({ ...ENTRI }); MODE = 'live'; }
    if (!RAW && params.get('preview')) { try { RAW = JSON.parse(localStorage.getItem('dbi_preview')); if (RAW) MODE = 'preview'; } catch (e) {} }
    const ID_HILANG = !!params.get('id') && !RAW;   // link tetap belum di-upload / salah ketik
    if (!RAW) RAW = demoData(params.get('demo') || params.get('theme') || 'maroon');

    const T = getTema(RAW.theme);
    const GUEST = (params.get('to') || '').trim().slice(0, 60);

    // ============================================================
    // 2. DATA AMAN UNTUK DITAMPILKAN
    // ============================================================
    const e = escapeHTML;
    const safeUrl = u => { u = String(u || '').trim(); return /^(https?:\/\/|musik\/)/i.test(u) ? u : ''; };
    const safeImg = u => safeUrl(fotoUrl(u));   // link Google Drive otomatis jadi link gambar
    const nick = s => String(s || '').split(',')[0].trim();
    const firstName = s => nick(s).split(/\s+/)[0] || '';
    const mapsSearch = v => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(v || '');
    const ROMAWI = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
    const BULAN_PENDEK = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

    function avatar(name) {
      const ch = (firstName(name)[0] || '?').toUpperCase().replace(/[<&>]/g, '');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${T.dark ? '#2A2A33' : '#EFE9E1'}"/><text x="50" y="64" font-size="44" text-anchor="middle" font-family="Georgia,serif" fill="${T.accent}">${ch}</text></svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function prep(r) {
      const events = (r.events || []).filter(ev => ev && (ev.venue || ev.date || ev.iso)).map(ev => ({
        name: e(ev.name || 'Acara'), date: e(ev.date || formatTanggalPanjang(ev.iso)), iso: ev.iso || '',
        time: e(ev.time || ''), venue: e(ev.venue || ''), maps: e(safeUrl(ev.mapsUrl) || mapsSearch(ev.venue)),
        start: e(((ev.time || '').match(/\d{1,2}[.:]\d{2}/) || [''])[0].replace(':', '.'))
      }));
      const iso = events[0] && events[0].iso;
      let dt = null;
      if (iso) { const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (m) dt = new Date(+m[1], +m[2] - 1, +m[3]); }
      return {
        brideNick: e(firstName(r.bride) || 'Mempelai'), groomNick: e(firstName(r.groom) || 'Mempelai'),
        brideFull: e(nick(r.bride) || 'Mempelai Wanita'), groomFull: e(nick(r.groom) || 'Mempelai Pria'),
        brideParents: e(r.brideParents || ''), groomParents: e(r.groomParents || ''),
        bridePhoto: e(safeImg(r.bridePhoto) || avatar(r.bride)), groomPhoto: e(safeImg(r.groomPhoto) || avatar(r.groom)),
        brideIg: e(String(r.brideIg || '').replace(/^@/, '').trim()), groomIg: e(String(r.groomIg || '').replace(/^@/, '').trim()),
        ini: e(((firstName(r.bride)[0] || '') + (firstName(r.groom)[0] || '')).toUpperCase()),
        cover: e(safeImg(r.coverPhoto) || safeImg(r.bridePhoto) || UNS(DEMO_COVERS[0])),
        events,
        venues: [...new Set(events.map(x => x.venue).filter(Boolean))],
        gifts: (r.gifts || []).filter(g => g && g.acc).map(g => ({ bank: e(g.bank || 'Rekening'), acc: e(g.acc), holder: e(g.holder || '') })),
        story: (r.story || []).filter(s => s && (s.title || s.text)).map(s => ({ year: e(s.year), title: e(s.title), text: e(s.text) })),
        gallery: (r.gallery || []).map(safeImg).filter(Boolean).slice(0, 9).map(e),
        dress: e(r.dress || ''), stream: e(safeUrl(r.stream)),
        turut: String(r.turut || '').split('\n').map(x => x.trim()).filter(Boolean).map(e),
        dt,
        dateLong: events[0] ? events[0].date : '',
        day: dt ? String(dt.getDate()).padStart(2, '0') : '', mon: dt ? String(dt.getMonth() + 1).padStart(2, '0') : '',
        monName: dt ? NAMA_BULAN[dt.getMonth()] : '', monShort: dt ? BULAN_PENDEK[dt.getMonth()] : '',
        roman: dt ? ROMAWI[dt.getMonth()] : '', year: dt ? dt.getFullYear() : '', weekday: dt ? NAMA_HARI[dt.getDay()] : ''
      };
    }
    const d = prep(RAW);

    // ============================================================
    // 3. GAYA TEMA & BAHASA
    // ============================================================
    const FONTS = { serif: "'Cormorant Garamond', serif", royal: "'Cinzel', serif", edit: "'Space Grotesk', sans-serif", script: "'Caveat', cursive", cursive: "'Alex Brush', cursive", sans: "'Jost', sans-serif", pinyon: "'Pinyon Script', cursive", vibes: "'Great Vibes', cursive", bodoni: "'Bodoni Moda', serif" };
    const SCRIPTY = ['cursive', 'script', 'pinyon', 'vibes'].includes(T.nameFont);
    (function applyTheme() {
      const vars = { '--bg': T.bg, '--surface': T.surface, '--text': T.text, '--muted': T.muted, '--accent': T.accent, '--on': T.onAccent, '--border': T.border, '--fh': FONTS[T.head] || FONTS.serif, '--fn': FONTS[T.nameFont] || FONTS.serif, '--bs': T.dashed ? 'dashed' : 'solid', '--bw': T.dashed ? '2px' : '1px' };
      Object.entries(vars).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
      const pat = T.motif ? motifPattern(T) : T.pattern;
      const root = document.getElementById('themeRoot');
      if (pat) { root.style.backgroundImage = pat; if (T.patternSize && !T.motif) root.style.backgroundSize = T.patternSize; }
      document.head.insertAdjacentHTML('beforeend', `<meta name="theme-color" content="${T.bg}">`);
    })();

    const VOICES = {

                <div class="text-right"><p class="text-[9px] tracking-[0.25em] t-muted">GROOM</p><p class="fh text-3xl leading-tight">${d.groomNick}</p></div>
              </div>
              <div class="grid grid-cols-3 gap-2 mt-6 text-left">
                <div><p class="text-[9px] tracking-[0.2em] t-muted">TANGGAL</p><p class="text-sm font-semibold mt-0.5">${d.day} ${d.monShort} ${d.year}</p></div>
                <div><p class="text-[9px] tracking-[0.2em] t-muted">JAM</p><p class="text-sm font-semibold mt-0.5">${d.events[0] ? d.events[0].start || '-' : '-'}</p></div>
                <div><p class="text-[9px] tracking-[0.2em] t-muted">GATE</p><p class="text-sm font-semibold mt-0.5 truncate">${d.venues[0] || '-'}</p></div>

    // ============================================================
    // 6. KUTIPAN (4 gaya)
    // ============================================================
    const useQuran = T.quote === 'arabic' || T.quote_src === 'quran' || (T.quote !== 'editorial' && ['islami', 'sunda', 'jawa', 'betawi', 'minang'].includes(T.voice));
    const Q = useQuran ? QURAN : CINTA;
    const QUOTE = {

      editorial: () => `

      boxed: () => `
        <section class="px-7 py-12">

      arabic: () => `
        <section class="px-8 py-14 text-center">

          <div class="reveal my-6">${divider()}</div>
          ${useQuran ? `<p class="reveal fa text-[22px] leading-[2.1]" dir="rtl" lang="ar">${QURAN.ar}</p>` : ''}

    // ============================================================
    // 7. MEMPELAI (7 gaya)
    // ============================================================
    const P = who => ({ photo: d[who + 'Photo'], full: d[who + 'Full'], nick: d[who + 'Nick'], parents: d[who + 'Parents'], ig: d[who + 'Ig'] });
    const B = P('bride'), G = P('groom');
    const intro = `<p class="reveal text-[13px] leading-relaxed text-center t-muted max-w-xs mx-auto mb-10">${V.open && T.voice !== 'formal' ? `<span class="block fh italic text-lg mb-2" style="color:var(--text)">${V.open}</span>` : ''}${V.intro}</p>`;
    const COUPLE = {
      arch: () => `
        <section id="sec-couple" class="px-7 py-14">${head('', V.couple)}${intro}
          <div class="grid grid-cols-2 gap-5">${[B, G].map(p => `

      columns: () => `
        <section id="sec-couple" class="border-b" style="border-color:var(--text)">
          <div class="px-6 pt-12">${intro}</div>
          <div class="grid grid-cols-2 border-t" style="border-color:var(--text)">${[['THE BRIDE', B], ['THE GROOM', G]].map(([lab, p], i) => `
            <div class="reveal p-5 ${i === 0 ? 'border-r' : ''}" style="border-color:var(--text)">
              <p class="text-[9px] tracking-[0.3em] t-muted">${lab}</p>
              <div class="mt-3 aspect-[3/4] overflow-hidden">${img(p.photo, 'w-full h-full object-cover', p.full)}</div>
              <p class="fh text-[28px] leading-none mt-4">${p.nick}</p>
              <p class="text-[11px] mt-2 leading-snug t-muted">${p.full}<br>${p.parents}</p>${igLink(p.ig)}
            </div>`).join('')}
          </div>
        </section>`,
      cards: () => `
        <section id="sec-couple" class="px-7 py-14">${head('', V.couple)}${intro}
          ${[B, G].map((p, i) => `
            ${i === 1 ? `<p class="reveal ${nameCls} text-center t-accent my-3" style="${S(34)}">&amp;</p>` : ''}
            <div class="reveal flex items-center gap-4 t-plain rounded-[26px] p-4 ${i === 1 ? 'flex-row-reverse text-right' : ''}">
              <div class="w-24 h-28 rounded-t-full rounded-b-2xl overflow-hidden shrink-0">${img(p.photo, 'w-full h-full object-cover', p.full)}</div>
              <div><p class="${nameCls}" style="${S(32)}">${p.nick}</p><p class="text-[12px] font-medium mt-1">${p.full}</p><p class="text-[11px] t-muted mt-0.5 leading-snug">${p.parents}</p>${igLink(p.ig)}</div>
            </div>`).join('')}
        </section>`,
      diamond: () => `
        <section id="sec-couple" class="px-7 py-14">${head('', V.couple)}${intro}
          <div class="grid grid-cols-2 gap-4 text-center">${[B, G].map(p => `
            <div class="reveal flex flex-col items-center">
              <div class="w-[118px] h-[118px] rotate-45 p-1.5 t-bda mt-5"><div class="w-full h-full overflow-hidden">${img(p.photo, 'w-[142%] h-[142%] max-w-none object-cover -rotate-45 -translate-x-[15%] -translate-y-[15%]', p.full)}</div></div>
              <p class="${nameCls} mt-10" style="${S(22, 1.5)}">${p.nick}</p>
              <p class="text-[11px] t-muted mt-2 leading-snug">${p.full}<br>${p.parents}</p>${igLink(p.ig)}
            </div>`).join('')}
          </div>
        </section>`,
      polaroid: () => `
        <section id="sec-couple" class="px-7 py-14">${head('', V.couple)}${intro}
          ${[B, G].map((p, i) => `
            <div class="reveal bg-white p-3 pb-5 shadow-lg ${i ? 'rotate-2 -mt-2 ml-auto' : '-rotate-2'} w-[78%] text-stone-800 ${i ? 'text-right' : ''}">
              ${img(p.photo, 'w-full aspect-[4/3] object-cover', p.full)}

      circle: () => `
        <section id="sec-couple" class="px-8 py-14 text-center">${head('', V.couple)}${intro}
          ${[B, G].map((p, i) => `
            ${i === 1 ? `<div class="reveal my-8">${divider()}</div>` : ''}

              <div class="w-40 h-40 rounded-full p-1.5 t-bda">${img(p.photo, 'w-full h-full object-cover rounded-full', p.full)}</div>

      overlap: () => `
        <section id="sec-couple" class="px-7 py-14">${head('', V.couple)}${intro}

            <span class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full t-btn flex items-center justify-center fh text-3xl italic shadow-lg">&amp;</span>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-6">${[B, G].map((p, i) => `
            <div class="reveal ${i ? 'text-right' : ''}"><p class="${nameCls}" style="${S(28)}">${p.nick}</p><p class="text-[11px] t-muted mt-1 leading-snug">${p.full}<br>${p.parents}</p>${igLink(p.ig)}</div>`).join('')}
          </div>
        </section>`
    };

    // ============================================================
    // 8. ACARA (6 gaya)
    // ============================================================
    const venueBlock = (cls = '') => sameVenue && d.events[0] ? `
      <div class="reveal ${cls} text-center">
        <p class="text-sm font-medium">${d.events[0].venue}</p>

    const EVENT = {
      royal: () => `
        <section id="sec-event" class="px-7 py-14">
          <div class="reveal t-surface px-6 py-10 text-center">
            <p class="eyebrow">${V.events}</p>
            ${d.dt ? `<div class="flex items-center justify-center gap-4 mt-6">
              <span class="text-[11px] tracking-[0.22em] uppercase t-muted">${e(d.weekday)}</span>

              <div class="pt-5 px-2 ${i % 2 === 0 && d.events.length > 1 ? 'border-r t-line' : ''}">
                <p class="fh text-[22px]">${ev.name}</p><p class="text-xs t-muted mt-1">${ev.time}</p>
                ${!sameVenue ? `<p class="text-xs mt-2">${ev.venue}</p><div class="mt-3">${btnMaps(ev, 't-outline rounded-full')}</div>` : ''}
              </div>`).join('')}
            </div>
            ${venueBlock('mt-7')}
          </div>
        </section>`,
      table: () => `
        <section id="sec-event" class="px-6 py-12">
          <p class="reveal text-[10px] tracking-[0.3em] uppercase t-muted mb-4">${V.events}</p>
          ${d.events.map((ev, i) => `
            <div class="reveal grid grid-cols-[92px_minmax(0,1fr)] gap-2 py-4 border-t ${i === d.events.length - 1 ? 'border-b' : ''}" style="border-color:var(--text)">
              <span class="fh text-[28px] leading-none">${ev.start || '—'}</span>
              <div><p class="text-[15px] font-medium">${ev.name}</p><p class="text-xs t-muted mt-0.5">${ev.date} · ${ev.time}</p><p class="text-xs t-muted">${ev.venue}</p></div>
            </div>`).join('')}
          ${d.events[0] ? `<div class="reveal grid grid-cols-2 gap-2.5 mt-5">${btnMaps(d.events[0], 'border rounded-none')}${btnCal(d.events[0], 'border rounded-none') || ''}</div>` : ''}
        </section>`,
      icons: () => `
        <section id="sec-event" class="px-7 py-14">${head('', V.events)}
          <div class="grid ${d.events.length > 1 ? 'grid-cols-2' : 'grid-cols-1'} gap-3">${d.events.map((ev, i) => `
            <div class="reveal t-plain rounded-[24px] px-4 py-6 text-center">
              <span class="mx-auto w-12 h-12 rounded-full flex items-center justify-center photo-ph"><i data-lucide="${i === 0 ? 'heart-handshake' : 'party-popper'}" class="w-5 h-5 t-accent"></i></span>
              <p class="fh text-[21px] font-semibold mt-3">${ev.name}</p><p class="text-xs t-muted mt-1">${ev.time}</p>
              ${!sameVenue ? `<p class="text-xs mt-2">${ev.venue}</p>` : ''}
            </div>`).join('')}
          </div>
          ${d.events[0] ? `<div class="reveal t-plain rounded-[24px] p-4 mt-3 flex items-center gap-3">
            <span class="w-11 h-11 rounded-full photo-ph flex items-center justify-center shrink-0"><i data-lucide="map-pin" class="w-5 h-5 t-accent"></i></span>
            <div class="flex-1 min-w-0"><p class="text-sm font-medium truncate">${d.venues.join(' & ')}</p><p class="text-xs t-muted">${d.dateLong}</p></div>
            <a href="${d.events[0].maps}" target="_blank" rel="noopener" class="t-outline rounded-full min-h-[44px] px-4 inline-flex items-center text-xs font-semibold">Maps</a>
          </div>` : ''}
        </section>`,
      deco: () => `
        <section id="sec-event" class="px-7 py-14">
          <div class="reveal relative px-6 py-10 text-center t-bda">
            ${['-left-px -top-px border-r border-b', '-right-px -top-px border-l border-b', '-left-px -bottom-px border-r border-t', '-right-px -bottom-px border-l border-t'].map(c => `<div class="absolute ${c} w-6 h-6" style="border-color:var(--accent)"></div>`).join('')}
            <p class="eyebrow">${V.events}</p>
            <p class="fh text-2xl mt-3">${d.dateLong}</p>
            <div class="grid ${d.events.length > 1 ? 'grid-cols-2' : 'grid-cols-1'} gap-3 mt-6">${d.events.map(ev => `
              <div class="border-t pt-3 t-line"><p style="font-family:'Cinzel',serif" class="text-[13px] tracking-[0.16em] uppercase">${ev.name}</p><p class="text-xs t-muted mt-1">${ev.time}</p>${!sameVenue ? `<p class="text-xs mt-1">${ev.venue}</p>` : ''}</div>`).join('')}
            </div>
            ${venueBlock('mt-7')}
          </div>
        </section>`,
      ticket: () => `
        <section id="sec-event" class="px-6 py-12">${head('', V.events)}
          ${d.events.map(ev => `
            <div class="reveal flex rounded-[20px] overflow-hidden mb-3 t-plain" style="border:1px solid var(--border)">
              <div class="t-btn w-24 shrink-0 flex flex-col items-center justify-center py-4"><span class="fh text-4xl leading-none">${ev.iso ? ev.iso.slice(8) : '--'}</span><span class="text-[10px] tracking-[0.2em] uppercase mt-1">${d.monShort}</span></div>
              <div class="flex-1 px-4 py-4 border-l-2 border-dashed t-line">
                <p class="text-[9px] tracking-[0.25em] t-muted">ACARA</p><p class="fh text-xl leading-tight">${ev.name}</p>
                <p class="text-xs mt-1">${ev.time}</p><p class="text-xs t-muted truncate">${ev.venue}</p>
                <a href="${ev.maps}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-[11px] font-semibold t-accent mt-2 min-h-[32px]"><i data-lucide="navigation" class="w-3.5 h-3.5"></i>Petunjuk lokasi</a>
              </div>
            </div>`).join('')}
        </section>`,
      timeline: () => `
        <section id="sec-event" class="px-8 py-14">${head('', V.events)}
          <p class="reveal text-center fh text-xl -mt-4 mb-8 t-muted">${d.dateLong}</p>
          <div class="relative pl-8">
            <div class="absolute left-[11px] top-2 bottom-2 w-px t-bg-accent opacity-50"></div>
            ${d.events.map(ev => `
              <div class="reveal relative pb-8">
                <span class="absolute -left-8 top-1 w-[23px] h-[23px] rounded-full th t-bda flex items-center justify-center"><span class="w-2 h-2 rounded-full t-bg-accent"></span></span>
                <p class="text-xs tracking-[0.2em] t-accent font-semibold">${ev.time}</p>
                <p class="fh text-2xl mt-1">${ev.name}</p>
                <p class="text-xs t-muted mt-0.5">${ev.venue}</p>
                <div class="flex flex-wrap gap-2 mt-3">${btnMaps(ev, 't-outline rounded-full')}${btnCal(ev, 't-outline rounded-full')}</div>
              </div>`).join('')}
          </div>
        </section>`
    };

    // ============================================================
    // 9. HITUNG MUNDUR (5 gaya)
    // ============================================================
    const hasCount = !!(d.events[0] && d.events[0].iso);
    const unit = [['cdD', 'Hari'], ['cdH', 'Jam'], ['cdM', 'Menit'], ['cdS', 'Detik']];
    const passed = `<p id="eventPassed" class="hidden text-center text-sm t-muted px-8">Alhamdulillah, acara telah berlangsung. Terima kasih atas doa dan kehadirannya.</p>`;
    const COUNT = {
      box: () => `<section class="px-7 py-12">${head('', V.count)}<div id="countdownWrap" class="reveal grid grid-cols-4 gap-2.5 text-center">${unit.map(([id, l]) => `<div class="t-bd py-3"><p id="${id}" class="fh text-[30px] leading-none tabular-nums">00</p><p class="text-[9px] tracking-[0.24em] uppercase t-muted mt-1.5">${l}</p></div>`).join('')}</div>${passed}</section>`,
      rules: () => `<section class="px-6 py-10 border-b" style="border-color:var(--text)"><p class="text-[10px] tracking-[0.3em] uppercase t-muted mb-4">${V.count}</p><div id="countdownWrap" class="reveal grid grid-cols-4">${unit.map(([id, l]) => `<div class="border-l pl-3" style="border-color:var(--text)"><p id="${id}" class="fh text-[38px] leading-none tabular-nums">00</p><p class="text-[9px] tracking-[0.24em] uppercase t-muted mt-1">${l}</p></div>`).join('')}</div>${passed}</section>`,
      pill: () => `<section class="px-7 py-12">${head('', V.count)}<div id="countdownWrap" class="reveal grid grid-cols-4 gap-2.5 text-center">${unit.map(([id, l]) => `<div class="t-btn rounded-[20px] py-3.5"><p id="${id}" class="fh text-[28px] font-semibold leading-none tabular-nums">00</p><p class="text-[9px] tracking-[0.2em] uppercase mt-1.5 opacity-90">${l}</p></div>`).join('')}</div>${passed}</section>`,
      ring: () => `<section class="px-7 py-12">${head('', V.count)}<div id="countdownWrap" class="reveal grid grid-cols-4 gap-2 text-center">${unit.map(([id, l]) => `<div class="mx-auto w-[70px] h-[70px] rounded-full t-bda flex flex-col items-center justify-center"><p id="${id}" class="fh text-2xl leading-none tabular-nums">00</p><p class="text-[8px] tracking-[0.2em] uppercase t-muted mt-1">${l}</p></div>`).join('')}</div>${passed}</section>`,
      inline: () => `<section class="px-8 py-12 text-center"><div id="countdownWrap" class="reveal"><p class="eyebrow">${V.count}</p><p class="fh text-[30px] leading-snug mt-3">Tinggal <span id="cdD" class="t-accent">00</span> hari lagi</p><p class="text-xs t-muted mt-2 tabular-nums"><span id="cdH">00</span> jam · <span id="cdM">00</span> menit · <span id="cdS">00</span> detik</p></div>${passed}</section>`
    };

    // ============================================================
    // 10. BAGIAN TAMBAHAN (muncul bila diisi klien)
    // ============================================================
    const STORY = {
      timeline: () => `
        <section id="sec-story" class="px-8 py-14">${head('', V.story)}
          <div class="relative">
            <div class="absolute left-1/2 top-0 bottom-0 w-px t-bg-accent opacity-40"></div>
            ${d.story.map((s, i) => `
              <div class="reveal relative grid grid-cols-2 gap-6 pb-9">
                <div class="${i % 2 ? 'order-2 text-left' : 'text-right'}"><p class="fh text-3xl t-accent leading-none">${s.year}</p></div>
                <div class="${i % 2 ? 'order-1 text-right' : 'text-left'}"><p class="font-medium text-sm">${s.title}</p><p class="text-xs t-muted leading-relaxed mt-1">${s.text}</p></div>
                <span class="absolute left-1/2 -translate-x-1/2 top-2 w-3 h-3 rounded-full t-bg-accent ring-4" style="--tw-ring-color:var(--bg)"></span>
              </div>`).join('')}
          </div>
        </section>`,
      chapters: () => `
        <section id="sec-story" class="px-7 py-14">${head('', V.story)}
          <div class="car -mx-7"><div class="car-track flex gap-3 overflow-x-auto no-scrollbar snap-x snap-mandatory px-7 pb-2">${d.story.map((s, i) => `
            <div class="reveal snap-start shrink-0 w-[78%] t-surface rounded-[24px] p-6">
              <p class="text-[10px] tracking-[0.3em] uppercase t-muted">Bab ${i + 1}</p>

          </div></div>

    };
    const GALLERY = {

    function giftHTML() {
      if (!d.gifts.length) return '';

        <section id="sec-gift" class="px-7 py-14 text-center">${head('', V.gift)}
          <p class="reveal text-xs t-muted max-w-xs mx-auto -mt-4 mb-6 leading-relaxed">${V.giftText}</p>
          ${d.gifts.map(g => `
            <div class="reveal t-surface rounded-[20px] p-5 text-left mb-3">
              <div class="flex justify-between items-center gap-3">

                <button type="button" data-acc="${g.acc}" onclick="copyAcc(this)" class="t-outline inline-flex items-center gap-1 px-3 min-h-[36px] rounded-full text-[11px] font-semibold"><i data-lucide="copy" class="w-3 h-3"></i> Salin</button>
              </div>
              <p class="font-mono text-lg font-semibold tracking-wider mt-2">${g.acc}</p>

    function rsvpHTML() {
      return `
        <section id="sec-rsvp" class="px-7 py-14 text-xs">${head('', V.rsvp)}
          <form onsubmit="handleWish(event)" class="reveal t-surface rounded-[24px] p-5 space-y-3">
            <label class="block"><span class="font-semibold">Nama</span><input id="wName" required maxlength="60" placeholder="Tuliskan nama Anda" class="t-input w-full p-3 rounded-xl mt-1"></label>
            <label class="block"><span class="font-semibold">Kehadiran</span>
              <select id="wStatus" class="t-input w-full p-3 rounded-xl mt-1"><option value="Hadir">Insya Allah hadir</option><option value="Tidak Hadir">Mohon maaf, tidak bisa hadir</option><option value="Masih Ragu">Masih ragu</option></select></label>
            <label class="block"><span class="font-semibold">Ucapan & doa</span><textarea id="wMsg" required rows="3" maxlength="500" placeholder="Tuliskan ucapan dan doa terbaik..." class="t-input w-full p-3 rounded-xl mt-1 resize-none"></textarea></label>
            <button class="t-btn w-full min-h-[48px] rounded-full font-semibold uppercase tracking-[0.18em] text-[11px]">Kirim Ucapan</button>
          </form>

    // ============================================================
    // 11. PENUTUP (3 gaya)
    // ============================================================
    const CLOSING = {
      script: () => `
        <footer class="px-8 pt-10 pb-12 text-center">
          ${divider()}
          <p class="reveal text-sm t-muted leading-relaxed mt-6 max-w-xs mx-auto">${V.closing}</p>
          <p class="reveal ${nameCls} t-accent mt-6" style="${S(40)}">${d.brideNick} &amp; ${d.groomNick}</p>
          <p class="text-[10px] t-muted mt-8">Undangan digital oleh <a href="dibuatin.html" class="font-semibold t-accent">di.buat.in</a></p>
        </footer>`,
      formal: () => `
        <footer class="px-8 pt-10 pb-12 text-center">
          ${divider()}
          <p class="reveal text-sm leading-relaxed mt-6 max-w-xs mx-auto">${V.closing}</p>
          ${V.closeSalam ? `<p class="reveal fh italic text-lg mt-5">${V.closeSalam}</p>` : ''}
          <p class="reveal eyebrow mt-8">${V.sign}</p>
          <p class="reveal ${nameCls} mt-3" style="${S(40)}">${d.brideNick} &amp; ${d.groomNick}</p>
          <p class="reveal fh text-xl t-accent mt-5">${V.thanks}</p>
          <p class="text-[10px] t-muted mt-8">Undangan digital oleh <a href="dibuatin.html" class="font-semibold t-accent">di.buat.in</a></p>
        </footer>`,
      editorial: () => `
        <footer class="px-6 pt-12 pb-12">
          <p class="reveal fh italic text-[34px] leading-tight">${V.closing}</p>
          <p class="reveal mt-5 text-[10px] tracking-[0.34em] uppercase t-muted">${d.brideNick} &amp; ${d.groomNick} — ${d.year}</p>
          <p class="text-[10px] t-muted mt-10">Undangan digital oleh <a href="dibuatin.html" class="font-semibold t-accent">di.buat.in</a></p>
        </footer>`
    };

    // ============================================================
    // 12. RAKIT HALAMAN SESUAI URUTAN DESAIN
    // ============================================================
    const RENDER = {
      hero: () => (HERO[T.hero] || HERO.royal)(),
      quote: () => (QUOTE[T.quote] || QUOTE.center)(),
      couple: () => (COUPLE[T.couple] || COUPLE.arch)(),
      events: () => d.events.length ? (EVENT[T.event] || EVENT.royal)() : '',
      count: () => hasCount ? (COUNT[T.count] || COUNT.box)() : '',
      story: () => d.story.length ? (STORY[T.story] || STORY.timeline)() : '',
      gallery: () => d.gallery.length ? (GALLERY[T.gallery] || GALLERY.grid)() : '',
      dress: EXTRA.dress, stream: EXTRA.stream, turut: EXTRA.turut,
      gift: giftHTML, rsvp: rsvpHTML,
      closing: () => (CLOSING[T.closing] || CLOSING.script)()
    };

    // Geser samping: tombol panah, seret mouse, dan titik penanda (bekerja di HP & desktop)
    function setupCarousels() {
      const arrow = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
      document.querySelectorAll('.car').forEach(car => {
        const track = car.querySelector('.car-track');
        const items = [...track.children];
        if (items.length < 2) return;
        const prev = Object.assign(document.createElement('button'), { type: 'button', className: 'car-btn prev', innerHTML: arrow('M15 18l-6-6 6-6') });
        const next = Object.assign(document.createElement('button'), { type: 'button', className: 'car-btn next', innerHTML: arrow('M9 18l6-6-6-6') });
        prev.setAttribute('aria-label', 'Sebelumnya'); next.setAttribute('aria-label', 'Berikutnya');
        const dots = document.createElement('div'); dots.className = 'car-dots';
        dots.innerHTML = items.map(() => '<span></span>').join('');
        car.append(prev, next, dots);
        const step = () => (items[1].offsetLeft - items[0].offsetLeft) || track.clientWidth * 0.7;
        prev.onclick = () => track.scrollBy({ left: -step(), behavior: 'smooth' });
        next.onclick = () => track.scrollBy({ left: step(), behavior: 'smooth' });
        const update = () => {
          const max = track.scrollWidth - track.clientWidth - 4;
          prev.hidden = track.scrollLeft <= 4; next.hidden = track.scrollLeft >= max;
          const mid = track.scrollLeft + track.clientWidth / 2;
          let cur = 0; items.forEach((it, i) => { if (it.offsetLeft <= mid) cur = i; });
          if (track.scrollLeft >= max) cur = items.length - 1;
          [...dots.children].forEach((dt, i) => dt.classList.toggle('on', i === cur));
        };
        track.addEventListener('scroll', update, { passive: true }); window.addEventListener('resize', update); update();
        // seret dengan mouse
        let down = false, sx = 0, sl = 0, moved = false;
        track.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; moved = false; sx = e.clientX; sl = track.scrollLeft; });
        window.addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - sx; if (Math.abs(dx) > 5) { moved = true; track.classList.add('dragging'); } if (moved) track.scrollLeft = sl - dx; });
        window.addEventListener('pointerup', () => {
          if (!down) return; down = false;
          if (moved) { track.classList.remove('dragging'); const i = Math.round(track.scrollLeft / step()); track.scrollTo({ left: i * step(), behavior: 'smooth' }); }
        });
        track.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
        track.addEventListener('dragstart', e => e.preventDefault());
      });
    }

    // Menu bawah, tombol musik & notifikasi selalu sejajar kolom undangan (di desktop tidak menutupi panel kiri)
    function alignFixed() {
      const r = document.getElementById('themeRoot').getBoundingClientRect();
      const nav = document.getElementById('bottomNav'), chip = document.getElementById('musicChip'), toast = document.getElementById('toast');
      if (nav) { nav.style.left = r.left + 'px'; nav.style.right = Math.max(0, innerWidth - r.right) + 'px'; }
      if (chip) chip.style.right = Math.max(16, innerWidth - r.right + 16) + 'px';
      if (toast) toast.style.left = (r.left + r.width / 2) + 'px';
    }
    window.addEventListener('resize', alignFixed);

    function render() {
      const order = (URUTAN[T.order] || URUTAN.islami);
      document.getElementById('templateRoot').innerHTML = order.map(k => (RENDER[k] ? RENDER[k]() : '')).join('');
      setupCarousels();
      alignFixed();

      const names = `${d.brideNick} & ${d.groomNick}`;
      const unesc = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
      document.title = `The Wedding of ${unesc(names)}`;

      // Sampul pembuka
      document.getElementById('coverCard').innerHTML = `
        <div class="absolute inset-2.5 rounded-[1.6rem] pointer-events-none t-bd"></div>
        ${T.motif ? motifSVG(T, T.motif === 'gunungan' ? 'w-16 h-20' : 'w-40 h-12') : T.hero === 'deco' ? fanSVG(120) : ''}
        <p class="eyebrow">${SALAM}</p>
        <div class="w-28 h-28 rounded-full overflow-hidden p-1 t-ring">${img(d.cover, 'w-full h-full object-cover rounded-full')}</div>
        <h1 class="${nameCls}" style="${S(38, 1.3)}">${names}</h1>
        ${d.dt ? `<p class="text-[11px] tracking-[0.3em] uppercase t-muted -mt-1">${d.day} · ${d.mon} · ${d.year}</p>` : ''}
        <div class="w-full">
          <p class="text-[11px] t-muted mb-1.5">Kepada Yth. Bapak/Ibu/Saudara/i</p>
          <div class="px-4 py-3 rounded-2xl fh text-xl font-semibold break-words" style="border-top:1px solid var(--border);border-bottom:1px solid var(--border)">${GUEST ? e(GUEST) : 'Tamu Undangan'}</div>
          ${GUEST ? '<p class="text-[10px] t-muted mt-1.5">Mohon maaf apabila ada kesalahan penulisan nama/gelar</p>' : ''}
        </div>
        <button type="button" onclick="openInvitation()" class="t-btn w-full min-h-[50px] rounded-full font-semibold text-[11px] uppercase tracking-[0.3em] flex items-center justify-center gap-2 shadow-lg">
          <i data-lucide="mail-open" class="w-4 h-4"></i> Buka Undangan
        </button>`;

      document.getElementById('desktopBg').src = unesc(d.cover);
      document.getElementById('desktopNames').innerHTML = names;
      document.getElementById('desktopDate').innerHTML = d.dateLong;
      document.getElementById('desktopVenue').innerHTML = d.venues.join(' & ');

      const NAV = [['sec-hero', 'home', 'Sampul'], ['sec-couple', 'heart', 'Mempelai'], ['sec-event', 'calendar', 'Acara'], ['sec-gallery', 'image', 'Galeri'], ['sec-gift', 'gift', 'Amplop'], ['sec-rsvp', 'message-circle', 'Ucapan']];
      document.getElementById('bottomNavInner').innerHTML = NAV.filter(n => document.getElementById(n[0])).slice(0, 5)
        .map(n => `<a href="#${n[0]}" class="flex flex-col items-center gap-0.5 px-1 min-w-[44px] hover:text-amber-200 transition-colors"><i data-lucide="${n[1]}" class="w-4 h-4"></i><span>${n[2]}</span></a>`).join('');

      if (MODE === 'preview') { document.getElementById('previewBanner').classList.remove('hidden'); document.getElementById('watermark').classList.remove('hidden'); }
      if (MODE === 'demo') {
        document.getElementById('demoBanner').classList.remove('hidden');
        document.getElementById('demoThemeName').textContent = T.name;
        document.getElementById('demoOrderLink').href = `dibuatin.html?tema=${encodeURIComponent(T.id)}#order`;
      }
      if (GUEST) { const w = document.getElementById('wName'); if (w) w.value = GUEST; }

      lucide.createIcons();
      renderWishes();
      startCountdown();
      const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('revealed'); io.unobserve(en.target); } }), { threshold: 0.08 });
      document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }

    // ============================================================
    // 13. INTERAKSI
    // ============================================================
    function startCountdown() {
      const ev = d.events[0];
      if (!ev || !ev.iso || !document.getElementById('cdD')) return;
      const tm = String((RAW.events[0] || {}).time || '').match(/(\d{1,2})[.:](\d{2})/);
      const target = new Date(`${ev.iso}T${tm ? tm[1].padStart(2, '0') + ':' + tm[2] : '08:00'}:00+07:00`).getTime();
      const pad = n => String(n).padStart(2, '0');
      const tick = () => {
        const diff = target - Date.now();
        if (diff <= 0) { document.getElementById('countdownWrap').classList.add('hidden'); document.getElementById('eventPassed').classList.remove('hidden'); clearInterval(timer); return; }
        document.getElementById('cdD').textContent = pad(Math.floor(diff / 864e5));
        document.getElementById('cdH').textContent = pad(Math.floor(diff % 864e5 / 36e5));
        document.getElementById('cdM').textContent = pad(Math.floor(diff % 36e5 / 6e4));
        document.getElementById('cdS').textContent = pad(Math.floor(diff % 6e4 / 1e3));
      };
      const timer = setInterval(tick, 1000); tick();
    }

    // Galeri
    function openLightbox(i) {
      const u = d.gallery[+i]; if (!u) return;
      const t = document.createElement('textarea'); t.innerHTML = u;
      document.getElementById('lightboxImg').src = t.value;
      const lb = document.getElementById('lightbox'); lb.classList.remove('hidden'); lb.classList.add('flex');
    }
    function closeLightbox(ev) {
      if (ev && ev.target && ev.target.id === 'lightboxImg') return;
      const lb = document.getElementById('lightbox'); lb.classList.add('hidden'); lb.classList.remove('flex');
    }
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeLightbox(); });

    // Musik (hanya bila klien memilih lagu)
    const bgMusic = document.getElementById('bgMusic');
    const MUSIC_SRC = safeUrl(RAW.musicUrl);
    let isPlaying = false, pausedByHide = false;
    function setMusicUI() {
      document.getElementById('vinylDisc').classList.toggle('vinyl-spin', isPlaying);
      document.getElementById('musicLabel').textContent = isPlaying ? 'Musik ON' : 'Musik OFF';
    }
    function playMusic() {
      if (!MUSIC_SRC) return;
      if (!bgMusic.src) bgMusic.src = MUSIC_SRC;
      bgMusic.play().then(() => { isPlaying = true; setMusicUI(); }).catch(() => { isPlaying = false; setMusicUI(); });
    }
    function toggleMusic() { if (isPlaying) { bgMusic.pause(); isPlaying = false; setMusicUI(); } else playMusic(); }
    bgMusic.addEventListener('error', () => { document.getElementById('musicChip').classList.add('hidden'); isPlaying = false; });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isPlaying) { bgMusic.pause(); isPlaying = false; pausedByHide = true; setMusicUI(); }
      else if (!document.hidden && pausedByHide) { pausedByHide = false; playMusic(); }
    });
    function openInvitation() {
      const modal = document.getElementById('coverModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => modal.classList.add('hidden'), 700);
      document.body.classList.remove('locked');
      if (MUSIC_SRC) { const chip = document.getElementById('musicChip'); chip.classList.remove('hidden'); chip.classList.add('flex'); playMusic(); }
    }

    // Salin rekening
    function toast(msg) {
      const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden');
      clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2200);
    }
    function copyAcc(btn) {
      const text = btn.dataset.acc; const ok = () => toast('Nomor rekening disalin');
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok).catch(() => fallbackCopy(text) && ok());
      else if (fallbackCopy(text)) ok();
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (err) {} ta.remove(); return ok;
    }

    // Buku tamu
    let wishes = MODE === 'demo' ? [{ name: 'Keluarga Besar', status: 'Hadir', msg: 'Barakallahu lakuma, semoga menjadi keluarga yang sakinah, mawaddah, warahmah.' }] : [];
    const STATUS_CLS = { 'Hadir': 'bg-emerald-100 text-emerald-800', 'Tidak Hadir': 'bg-red-100 text-red-800', 'Masih Ragu': 'bg-amber-100 text-amber-800' };
    function renderWishes() {
      const box = document.getElementById('wishesBox'); if (!box) return;
      box.innerHTML = wishes.map(w => `
        <div class="t-surface rounded-xl p-3 space-y-1">
          <div class="flex justify-between items-center gap-2"><strong class="break-words">${escapeHTML(w.name)}</strong><span class="shrink-0 text-[10px] px-2 py-0.5 rounded font-bold ${STATUS_CLS[w.status] || ''}">${escapeHTML(w.status)}</span></div>
          <p class="t-muted break-words">${escapeHTML(w.msg)}</p>
        </div>`).join('');
    }
    function handleWish(ev) {
      ev.preventDefault();
      const name = document.getElementById('wName').value.trim(), status = document.getElementById('wStatus').value, msg = document.getElementById('wMsg').value.trim();
      if (!name || !msg) return;
      wishes.unshift({ name, status, msg }); renderWishes(); document.getElementById('wMsg').value = '';
      const notice = document.getElementById('rsvpNotice'); const wa = normalizeWa(RAW.wa);
      if (MODE === 'live' && wa.length >= 10) {
        const text = `Assalamu'alaikum, saya *${name}* ingin konfirmasi kehadiran di pernikahan ${firstName(RAW.bride)} & ${firstName(RAW.groom)}.\n\nKehadiran: *${status}*\nUcapan: ${msg}`;
        notice.innerHTML = `<a href="https://wa.me/${wa}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 w-full min-h-[48px] rounded-full font-semibold text-white bg-[#25D366]"><i data-lucide="send" class="w-4 h-4"></i> Kirim konfirmasi ke WhatsApp mempelai</a>`;
        lucide.createIcons();
      } else notice.innerHTML = `<p class="text-center t-muted">Terima kasih atas ucapannya!</p>`;
    }

    // ============================================================
    // 14. CEK KEASLIAN LINK SEBELUM MENAMPILKAN
    // ============================================================
    function showInvalid(judul = 'Link undangan tidak valid', isi = 'Link ini tidak lengkap atau isinya telah diubah. Mohon minta link resmi langsung kepada mempelai.') {
      document.body.classList.remove('locked');
      document.body.innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#FAF8F5;font-family:'Jost',sans-serif;color:#23201E">
          <div style="max-width:360px;text-align:center;background:#fff;border:1px solid #E8DFD8;border-radius:24px;padding:28px">
            <h1 style="font-size:20px;font-weight:600;margin:0 0 8px">${judul}</h1>
            <p style="font-size:13px;color:#716B67;line-height:1.6">${isi}</p>
            <a href="dibuatin.html" style="display:inline-block;margin-top:16px;font-size:12px;color:#662626;font-weight:700">di.buat.in</a>
          </div>
        </div>`;
      document.title = judul;
    }
    (async function init() {
      if (ID_HILANG) return showInvalid('Undangan belum tersedia', 'Undangan ini sedang disiapkan atau alamatnya salah ketik. Silakan coba lagi nanti, atau minta link langsung kepada mempelai.');
      if (SIGNED) {
        if (!RAW || MODE !== 'live') return showInvalid();
        const status = await verifyUndangan(SIGNED.u, SIGNED.s);
        if (status === 'invalid') return showInvalid();
      }
      render();
    })();
  </script>
