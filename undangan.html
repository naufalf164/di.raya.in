<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="titleTag">The Wedding Celebration — di.buat.in</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts Lengkap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
    .font-serif { font-family: 'Cormorant Garamond', serif; }
    .font-royal { font-family: 'Cinzel', serif; }
    .font-editorial { font-family: 'Space Grotesk', sans-serif; }
    .font-script { font-family: 'Caveat', cursive; }

    @keyframes spinDisc { 100% { transform: rotate(360deg); } }
    .vinyl-spin { animation: spinDisc 5s linear infinite; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#121214] text-stone-800 flex justify-center min-h-screen antialiased select-none">

  <audio id="bgMusic" loop preload="auto"></audio>

  <!-- ================= TOP CONTROLLER: 10 TEMA INSTAN ================= -->
  <div class="fixed top-0 inset-x-0 z-50 max-w-[480px] mx-auto bg-black/90 backdrop-blur-md border-b border-white/20 px-3 py-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
    <span class="text-[9px] font-bold uppercase tracking-widest text-amber-400 shrink-0 flex items-center gap-1">
      <i data-lucide="palette" class="w-3 h-3"></i> Tema:
    </span>
    <button onclick="switchDemoTheme('maroon')" class="theme-btn px-2.5 py-1 rounded-full text-[10px] font-semibold bg-white text-black shrink-0" data-theme="maroon">1. Arch Maroon</button>
    <button onclick="switchDemoTheme('monochrome')" class="theme-btn px-2.5 py-1 rounded-full text-[10px] font-semibold bg-stone-800 text-stone-300 hover:text-white shrink-0" data-theme="monochrome">2. Vogue Mag</button>
    <button onclick="switchDemoTheme('sage')" class="theme-btn px-2.5 py-1 rounded-full text-[10px] font-semibold bg-stone-800 text-stone-300 hover:text-white shrink-0" data-theme="sage">3. Glass Botanical</button>
    <button onclick="switchDemoTheme('navy')" class="theme-btn px-2.5 py-1 rounded-full text-[10px] font-semibold bg-stone-800 text-stone-300 hover:text-white shrink-0" data-theme="navy">4. Royal Navy</button>
    <button onclick="switchDemoTheme('blush')" class="theme-btn px-2.5 py-1 rounded-full text-[10px] font-semibold bg-stone-800 text-stone-300 hover:text-white shrink-0" data-theme="blush">5. Polaroid Blush</button>
    <button onclick="switchDemoTheme('rustic')" class="theme-btn px-2.5 py-1 rounded-full text-[10px] font-semibold bg-stone-800 text-stone-300 hover:text-white shrink-0" data-theme="rustic">6. Boho Rustic</button>
    <button onclick="switchDemoTheme('javanese')" class="theme-btn px-2.5 py-1 rounded-full text-[10px] font-semibold bg-stone-800 text-stone-300 hover:text-white shrink-0" data-theme="javanese">7. Keraton Jawa</button>
    <button onclick="switchDemoTheme('lilac')" class="theme-btn px-2.5 py-1 rounded-full text-[10px] font-semibold bg-stone-800 text-stone-300 hover:text-white shrink-0" data-theme="lilac">8. Melati Sunda</button>
    <button onclick="switchDemoTheme('emerald')" class="theme-btn px-2.5 py-1 rounded-full text-[10px] font-semibold bg-stone-800 text-stone-300 hover:text-white shrink-0" data-theme="emerald">9. Gatsby Deco</button>
    <button onclick="switchDemoTheme('celestial')" class="theme-btn px-2.5 py-1 rounded-full text-[10px] font-semibold bg-stone-800 text-stone-300 hover:text-white shrink-0" data-theme="celestial">10. Cosmic Night</button>
  </div>

  <!-- ================= CONTAINER UTAMA UNDANGAN ================= -->
  <main class="w-full max-w-[480px] min-h-screen shadow-2xl relative flex flex-col pt-10 pb-20 overflow-hidden bg-white" id="mainContainer">
    
    <!-- Modal Cover Buka Undangan -->
    <div id="coverModal" class="fixed inset-0 z-40 flex items-center justify-center bg-black/90 backdrop-blur-md p-4 transition-opacity duration-700">
      <div class="w-full max-w-sm bg-stone-50 rounded-3xl p-8 text-center shadow-2xl border border-stone-200 flex flex-col items-center space-y-4">
        <span class="text-[10px] uppercase tracking-[0.25em] text-stone-500 font-bold">Walimatul 'Ursy</span>
        <h1 class="font-serif text-4xl text-stone-900" id="coverTitle">Sarah & Rizky</h1>

        <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-stone-400 p-1 shadow bg-stone-200">
          <img id="coverAvatar" src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=500&auto=format&fit=crop&q=80" class="w-full h-full object-cover rounded-full">
        </div>

        <p class="text-xs text-stone-500">Kepada Yth. Bapak/Ibu/Saudara/i:</p>
        <div class="bg-stone-200/80 px-5 py-2.5 rounded-2xl text-xs font-bold text-stone-800 w-full">
          Tamu Undangan yang Berbahagia
        </div>

        <button onclick="openInvitation()" class="w-full py-3.5 bg-stone-900 text-white font-bold text-xs uppercase tracking-widest rounded-full shadow-lg hover:bg-stone-800 transition-all active:scale-95 flex items-center justify-center gap-2">
          <i data-lucide="mail-open" class="w-4 h-4"></i>
          <span>Buka Undangan</span>
        </button>
      </div>
    </div>

    <!-- Floating Vinyl Audio Player -->
    <div onclick="toggleMusic()" class="fixed top-12 right-4 z-30 cursor-pointer flex items-center gap-2 bg-black/80 backdrop-blur-md p-1.5 pr-3 rounded-full text-white border border-white/20 shadow-xl">
      <div id="vinylDisc" class="w-7 h-7 rounded-full bg-stone-900 border border-stone-500 flex items-center justify-center">
        <div class="w-2 h-2 rounded-full bg-amber-400"></div>
      </div>
      <span class="text-[9px] font-bold uppercase tracking-wider" id="musicLabel">Music ON</span>
    </div>

    <!-- Template Output Renderer -->
    <div id="templateRoot" class="w-full flex flex-col"></div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-3 inset-x-0 z-30 max-w-[400px] mx-auto px-4">
      <div class="bg-black/85 backdrop-blur-md text-white border border-white/20 rounded-full py-2 px-4 flex items-center justify-around shadow-2xl text-[9px]">
        <a href="#sec-hero" class="flex flex-col items-center hover:text-amber-400 transition-colors"><i data-lucide="home" class="w-4 h-4"></i><span>Cover</span></a>
        <a href="#sec-couple" class="flex flex-col items-center hover:text-amber-400 transition-colors"><i data-lucide="heart" class="w-4 h-4"></i><span>Pasangan</span></a>
        <a href="#sec-event" class="flex flex-col items-center hover:text-amber-400 transition-colors"><i data-lucide="calendar" class="w-4 h-4"></i><span>Acara</span></a>
        <a href="#sec-gift" class="flex flex-col items-center hover:text-amber-400 transition-colors"><i data-lucide="gift" class="w-4 h-4"></i><span>Amplop</span></a>
        <a href="#sec-rsvp" class="flex flex-col items-center hover:text-amber-400 transition-colors"><i data-lucide="message-circle" class="w-4 h-4"></i><span>RSVP</span></a>
      </div>
    </nav>

  </main>

    const urlParams = new URLSearchParams(window.location.search);
    let activeTheme = urlParams.get('demo') || 'maroon';
    const idSlug = urlParams.get('id');

    let currentData = demoData[activeTheme] || demoData.maroon;
    if (idSlug) {
      const stored = localStorage.getItem('dbi_order_' + idSlug);
      if (stored) {
        try { 
          currentData = JSON.parse(stored);
          activeTheme = currentData.theme || 'maroon';
        } catch(e){}
      }
    }

      // 1. TEMA MONOCHROME (VOGUE MAGAZINE EDITORIAL)

              </div>

                <textarea id="wMsg" required rows="3" placeholder="YOUR BLESSING MESSAGE..." class="w-full p-3 border-2 border-black text-xs uppercase outline-none resize-none"></textarea>

      // 2. TEMA JAVANESE HERITAGE (GUNUNGAN KERATON & BATIK SOGAN)

        return `
          <div class="bg-[#FAF5ED] text-[#3D2514] min-h-screen font-serif">

            <section id="sec-event" class="py-12 px-6 border-b border-[#D4B896] space-y-4">

    }

    let wishes = [
      { name: "Keluarga Besar Bpk. Hendra", status: "Hadir", msg: "Barakallah, semoga sakinah mawaddah warahmah selalu." }
    ];

    function renderWishesList() {
      const box = document.getElementById('wishesBox');
      if (!box) return;
      box.innerHTML = '';
      wishes.forEach(w => {
        const item = document.createElement('div');
        item.className = "bg-stone-100 border border-stone-300 p-3 rounded-xl text-xs space-y-1 shadow-sm";
        item.innerHTML = `
          <div class="flex justify-between items-center"><strong>${w.name}</strong><span class="text-[10px] px-2 py-0.5 rounded font-bold ${w.status === 'Hadir' ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-200 text-stone-600'}">${w.status}</span></div>
          <p class="text-stone-600">${w.msg}</p>
        `;
        box.appendChild(item);
      });
    }

    function handleWish(e) {
      e.preventDefault();
      const name = document.getElementById('wName').value.trim();
      const status = document.getElementById('wStatus').value;
      const msg = document.getElementById('wMsg').value.trim();
      if (!name || !msg) return;
      wishes.unshift({ name, status, msg });
      renderWishesList();
      document.getElementById('wName').value = '';
      document.getElementById('wMsg').value = '';
    }

    renderPage();
  </script>
</body>
</html>
