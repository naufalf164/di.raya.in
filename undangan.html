            <form onsubmit="handleGuestWish(event)" class="bg-[#F4EFEA] p-5 rounded-3xl border border-[#E8DFD8] space-y-3">
              <input type="text" id="wName" required placeholder="Nama Lengkap" class="w-full p-2.5 bg-white border border-[#E8DFD8] rounded-xl outline-none">
              <select id="wStatus" class="w-full p-2.5 bg-white border border-[#E8DFD8] rounded-xl outline-none"><option value="Hadir">Hadir</option><option value="Tidak Hadir">Tidak Hadir</option></select>
              <textarea id="wMsg" required rows="3" placeholder="Tulis doa restu..." class="w-full p-2.5 bg-white border border-[#E8DFD8] rounded-xl outline-none resize-none"></textarea>
              <button class="w-full py-3 bg-[#662626] text-white font-bold rounded-xl">Kirim Ucapan</button>
            </form>
            <div id="wishesFeed" class="space-y-2"></div>
          </section>
        </div>
      `;
    }

    // Inisialisasi & Render
    document.getElementById('templateRoot').innerHTML = buildTemplate(currentData);
    document.getElementById('titleTag').innerText = `The Wedding of ${currentData.bride} & ${currentData.groom}`;
    lucide.createIcons();

    // Kontrol Musik & Buka Undangan
    const bgMusic = document.getElementById('bgMusic');
    let isPlaying = false;

    function openInvitation() {
      const modal = document.getElementById('coverModal');
      if (modal) modal.classList.add('hidden');
      
      // Menggunakan link audio stabil
      bgMusic.src = 'https://commondatastorage.googleapis.com/codeskulptor-demos/riceracer_assets/music/win.ogg';
      bgMusic.play().then(() => {
        isPlaying = true;
        document.getElementById('vinylDisc').classList.add('spin-slow');
      }).catch(() => {});
    }

    function toggleMusic() {
      const disc = document.getElementById('vinylDisc');
      const label = document.getElementById('musicLabel');
      if (isPlaying) {
        bgMusic.pause();
        isPlaying = false;
        disc.classList.remove('spin-slow');
        label.innerText = "Music OFF";
      } else {
        bgMusic.play();
        isPlaying = true;
        disc.classList.add('spin-slow');
        label.innerText = "Music ON";
      }
    }

    function copyBankAcc(acc) {
      navigator.clipboard.writeText(acc).then(() => alert('Nomor rekening ' + acc + ' berhasil disalin!'));
    }

    let wishes = [
      { name: "Keluarga Besar Bpk. Hendra", status: "Hadir", msg: "Barakallah, semoga menjadi keluarga sakinah mawaddah warahmah." }
    ];

    function renderWishes() {
      const box = document.getElementById('wishesFeed');
      if (!box) return;
      box.innerHTML = '';
      wishes.forEach(w => {
        const item = document.createElement('div');
        item.className = "bg-white/80 border border-stone-300 p-3 rounded-xl text-xs space-y-1";
        item.innerHTML = `
          <div class="flex justify-between items-center"><strong>${w.name}</strong><span class="text-[10px] px-2 py-0.5 rounded font-bold ${w.status === 'Hadir' ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-200 text-stone-600'}">${w.status}</span></div>
          <p class="text-stone-600">${w.msg}</p>
        `;
        box.appendChild(item);
      });
    }

    function handleGuestWish(e) {
      e.preventDefault();
      const name = document.getElementById('wName').value.trim();
      const status = document.getElementById('wStatus').value;
      const msg = document.getElementById('wMsg').value.trim();
      if (!name || !msg) return;
      wishes.unshift({ name, status, msg });
      renderWishes();
      document.getElementById('wName').value = '';
      document.getElementById('wMsg').value = '';
    }

    renderWishes();
  </script>
</body>
</html>
