<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titleTag">Undangan Pernikahan — di.buat.in</title>
  <meta name="description" content="Undangan pernikahan digital — di.buat.in by di.raya.in">
  <meta property="og:title" content="Undangan Pernikahan">
  <meta property="og:description" content="Kami mengundang Anda untuk hadir dan memberikan doa restu.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=1200&auto=format&fit=crop&q=80">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@600;700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
    body.locked { overflow: hidden; }
    .fh { font-family: var(--fh); }
    .fn { font-family: var(--fn); }
    .th { background: var(--bg); color: var(--text); }
    .t-surface { background: var(--surface); border: var(--bw, 1px) var(--bs, solid) var(--border); }
    .t-muted { color: var(--muted); }
    .t-accent { color: var(--accent); }
    .t-btn { background: var(--accent); color: var(--on); }
    .t-btn:hover { filter: brightness(1.08); }
    .t-outline { border: 1px solid var(--accent); color: var(--accent); }
    .t-line { border-color: var(--border); }
    .t-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
    .t-input::placeholder { color: var(--muted); opacity: .8; }
    .t-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .t-ring { border: 2px solid var(--accent); }

    @keyframes spinDisc { to { transform: rotate(360deg); } }
    .vinyl-spin { animation: spinDisc 5s linear infinite; }
    @keyframes floatSoft { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .animate-float { animation: floatSoft 4s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .fade-up { animation: fadeUp .9s ease both; }

    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
    .reveal.revealed { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .reveal, .fade-up, .animate-float, .vinyl-spin { animation: none; transition: none; opacity: 1; transform: none; }
    }
    .watermark { background-image: repeating-linear-gradient(-30deg, transparent 0 120px, rgba(0,0,0,.035) 120px 122px); }
  </style>
</head>
<body class="locked antialiased flex justify-center min-h-screen" style="background:#121214">

  <audio id="bgMusic" loop preload="none"></audio>

  <div class="w-full max-w-7xl min-h-screen flex flex-col lg:flex-row items-stretch justify-center relative">

    <!-- SISI KIRI (khusus layar laptop) -->
    <aside class="hidden lg:flex lg:w-1/2 bg-[#18181B] text-white p-12 flex-col justify-between overflow-hidden sticky top-0 h-screen border-r border-white/10">
      <img id="desktopBg" src="" alt="" class="absolute inset-0 w-full h-full object-cover opacity-35">
      <div class="absolute inset-0 bg-gradient-to-t from-[#18181B] via-[#18181B]/60 to-transparent"></div>
      <div class="relative z-10">
        <span class="text-[10px] font-bold uppercase tracking-[0.3em] text-amber-300 bg-black/40 px-3 py-1 rounded-full border border-white/10">Undangan Digital</span>
      </div>
      <div class="relative z-10 space-y-4">
        <span class="text-sm italic text-amber-200" style="font-family:'Cormorant Garamond',serif">The Wedding of</span>
        <h1 id="desktopNames" class="text-6xl leading-none tracking-tight" style="font-family:'Cormorant Garamond',serif"></h1>
        <p id="desktopDate" class="text-xs text-stone-300 tracking-widest uppercase"></p>
        <div class="pt-4 border-t border-white/20 flex items-center gap-3 text-xs text-stone-300">
          <i data-lucide="map-pin" class="w-4 h-4 text-amber-300"></i>
          <span id="desktopVenue"></span>
        </div>
      </div>
      <div class="relative z-10 text-[11px] text-stone-400">di.buat.in <span class="text-stone-500">by di.raya.in</span></div>
    </aside>

    <!-- LEMBAR UNDANGAN -->
    <main id="themeRoot" class="th w-full lg:w-1/2 max-w-[480px] min-h-screen relative flex flex-col pb-24 mx-auto shadow-2xl">

      <!-- Banner mode pratinjau -->
      <div id="previewBanner" class="hidden sticky top-0 z-[45] bg-amber-400 text-black text-[11px] font-semibold text-center px-3 py-2 leading-snug">
        👀 PRATINJAU — undangan ini belum aktif. Link resmi dikirim admin setelah pembayaran dikonfirmasi.
      </div>
      <div id="demoBanner" class="hidden sticky top-0 z-[45] bg-black/85 text-white text-[11px] text-center px-3 py-2">
        Contoh template <strong id="demoThemeName"></strong> •
        <a href="dibuatin.html#order" id="demoOrderLink" class="underline font-semibold text-amber-300">Pakai desain ini</a>
      </div>
      <div id="watermark" class="hidden pointer-events-none fixed inset-0 z-[44] watermark"></div>

      <!-- Cover -->
      <div id="coverModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 transition-opacity duration-700">
        <div id="coverCard" class="fade-up th w-full max-w-sm rounded-3xl p-7 text-center shadow-2xl flex flex-col items-center gap-4" style="border:1px solid var(--border)"></div>
      </div>

      <!-- Tombol musik -->
      <button id="musicChip" type="button" onclick="toggleMusic()" aria-label="Putar / jeda musik" class="hidden fixed top-4 z-40 items-center gap-2 bg-black/80 backdrop-blur-md p-1.5 pr-3 rounded-full text-white border border-white/20 shadow-xl active:scale-95" style="right:max(1rem, calc(50% - 240px + 1rem))">
        <span id="vinylDisc" class="w-7 h-7 rounded-full bg-stone-900 border border-stone-500 flex items-center justify-center"><span class="w-2 h-2 rounded-full bg-amber-400"></span></span>
        <span class="text-[9px] font-bold uppercase tracking-wider" id="musicLabel">Musik</span>
      </button>

      <div id="templateRoot" class="w-full flex flex-col"></div>

      <!-- Navigasi bawah -->
      <nav id="bottomNav" class="fixed bottom-3 inset-x-0 z-30 max-w-[390px] mx-auto px-4">
        <div id="bottomNavInner" class="bg-black/85 backdrop-blur-md text-white border border-white/20 rounded-full py-2 px-3 flex items-center justify-around shadow-2xl text-[9px]"></div>
      </nav>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[60] hidden bg-black text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-xl"></div>

  <script src="tema.js"></script>
  <!-- Opsional: daftar undangan berlink pendek (undangan.html?id=slug). Boleh tidak ada. -->
  <script src="undangan-data.js" onerror="void 0"></script>
  <script>
    // ============================================================
    // 1. AMBIL DATA UNDANGAN
    //    ?u=...        -> link resmi dari admin (data ada di dalam link)
    //    ?id=slug      -> link pendek dari undangan-data.js (opsional)
    //    ?preview=1    -> pratinjau klien sebelum bayar (tersimpan di HP klien saja)
    //    ?demo=tema    -> contoh template
    //    &to=Nama      -> nama tamu di sampul
    // ============================================================
    const params = new URLSearchParams(location.search);
    const UNS = id => `https://images.unsplash.com/${id}?w=700&auto=format&fit=crop&q=80`;
    const DEMO_COVERS = ['photo-1583939003579-730e3918a45a','photo-1519741497674-611481863552','photo-1511285560929-80b456fea0bc','photo-1532712938310-34cb3982ef74','photo-1520854221256-17451cc331bf','photo-1469371670807-013ccf25f16a','photo-1606800052052-a08af7148866','photo-1522673607200-164d1b6ce486','photo-1544077960-604201fe74bc','photo-1518895949257-7621c3c786d7'];
    const DEMO_PASANGAN = [
      ['Sarah Amanda, S.Kom', 'Putri dari Bpk. Hendra & Ibu Rina', 'photo-1534528741775-53994a69daeb', 'Rizky Pratama, S.T', 'Putra dari Bpk. Bambang & Ibu Dewi', 'photo-1506794778202-cad84cf45f1d'],
      ['Nadia Larasati', 'Putri dari Bpk. Suryo & Ibu Wati', 'photo-1524504388940-b1c1722653e1', 'Bagas Wicaksono', 'Putra dari Bpk. Hartono & Ibu Sri', 'photo-1492562080023-ab3db95bfbce'],
      ['Putri Aurelia', 'Putri dari Bpk. Danu & Ibu Maya', 'photo-1544005313-94ddf0286df2', 'Reza Mahendra', 'Putra dari Bpk. Aris & Ibu Rini', 'photo-1519085360753-af0119f7cbe7'],
      ['Moniqa Anindya', 'Putri dari Bpk. Anton & Ibu Siska', 'photo-1494790108377-be9c29b29330', 'Fauzi Hidayat', 'Putra dari Bpk. Rahman & Ibu Nur', 'photo-1507003211169-0a1dd7228f2d'],
      ['Dinda Salsabila', 'Putri dari Bpk. H. Asep & Ibu Hj. Eni', 'photo-1517841905240-472988babdf9', 'Gilang Permana', 'Putra dari Bpk. H. Cecep & Ibu Hj. Teti', 'photo-1500648767791-00dcc994a43e']
    ];

    function demoData(themeId) {
      const idx = Math.max(0, DAFTAR_TEMA.findIndex(t => t.id === themeId));
      const p = DEMO_PASANGAN[idx % DEMO_PASANGAN.length];
      const d = new Date(); d.setDate(d.getDate() + 45);
      while (d.getDay() !== 6) d.setDate(d.getDate() + 1); // hari Sabtu
      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      return {
        theme: themeId,
        bride: p[0], brideParents: p[1], bridePhoto: UNS(p[2]), brideIg: '',
        groom: p[3], groomParents: p[4], groomPhoto: UNS(p[5]), groomIg: '',
        coverPhoto: UNS(DEMO_COVERS[idx % DEMO_COVERS.length]),
        events: [
          { name: 'Akad Nikah', iso, date: formatTanggalPanjang(iso), time: '08.00 – 10.00 WIB', venue: 'Masjid Agung Cianjur', mapsUrl: '' },
          { name: 'Resepsi', iso, date: formatTanggalPanjang(iso), time: '11.00 – 15.00 WIB', venue: 'Gedung Serbaguna, Cianjur', mapsUrl: '' }
        ],
        gifts: [{ bank: 'Bank Contoh', acc: '1234567890', holder: p[3].split(',')[0] }],
        musicUrl: musikUrl('romantic-piano'), wa: ''
      };
    }

    // Kompatibel dengan data lama (date/time/venue tunggal, bankName/bankAcc)
    function upgradeLegacy(o) {
      if (!o) return o;
      if (!o.events && (o.date || o.venue)) o.events = [{ name: 'Akad & Resepsi', date: o.date, time: o.time, venue: o.venue, mapsUrl: o.mapsUrl }];
      if (!o.gifts && o.bankAcc) o.gifts = [{ bank: o.bankName, acc: o.bankAcc, holder: o.bankHolder }];
      return o;
    }

    let MODE = 'demo', RAW = null;
    if (params.get('u')) { RAW = decodeUndangan(params.get('u')); if (RAW) MODE = 'live'; }
    if (!RAW && params.get('id') && typeof UNDANGAN_DATA !== 'undefined' && UNDANGAN_DATA[params.get('id')]) {
      RAW = upgradeLegacy({ ...UNDANGAN_DATA[params.get('id')] }); MODE = 'live';
    }
    if (!RAW && params.get('preview')) {
      try { RAW = JSON.parse(localStorage.getItem('dbi_preview')); if (RAW) MODE = 'preview'; } catch (e) {}
    }
    if (!RAW) RAW = demoData(params.get('demo') || params.get('theme') || 'maroon');

    const T = getTema(RAW.theme);
    const GUEST = (params.get('to') || '').trim().slice(0, 60);

    // ============================================================
    // 2. SIAPKAN DATA AMAN UNTUK DITAMPILKAN (anti sisipan kode)
    // ============================================================
    const safeUrl = u => { u = String(u || '').trim(); return /^(https?:\/\/|musik\/)/i.test(u) ? u : ''; };
    const nick = s => String(s || '').split(',')[0].trim();
    const firstName = s => nick(s).split(/\s+/)[0] || '';
    const mapsSearch = v => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(v || '');

    function avatar(name) {
      const ch = (firstName(name)[0] || '?').toUpperCase();
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${T.surface.startsWith('rgba') ? T.bg : T.surface}"/><text x="50" y="62" font-size="44" text-anchor="middle" font-family="Georgia,serif" fill="${T.accent}">${ch.replace(/[<&>]/g, '')}</text></svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function prep(r) {
      const e = escapeHTML;
      const events = (r.events || []).filter(ev => ev && (ev.venue || ev.date || ev.iso)).map(ev => ({
        name: e(ev.name || 'Acara'),
        date: e(ev.date || formatTanggalPanjang(ev.iso)),
        iso: ev.iso || '',
        time: e(ev.time || ''),
        venue: e(ev.venue || ''),
        maps: e(safeUrl(ev.mapsUrl) || mapsSearch(ev.venue))
      }));
      return {
        bride: e(nick(r.bride) || 'Mempelai Wanita'), brideFull: e(r.bride || 'Mempelai Wanita'), brideNick: e(firstName(r.bride)),
        groom: e(nick(r.groom) || 'Mempelai Pria'), groomFull: e(r.groom || 'Mempelai Pria'), groomNick: e(firstName(r.groom)),
        brideParents: e(r.brideParents || ''), groomParents: e(r.groomParents || ''),
        bridePhoto: e(safeUrl(r.bridePhoto) || avatar(r.bride)),
        groomPhoto: e(safeUrl(r.groomPhoto) || avatar(r.groom)),
        brideIg: e(String(r.brideIg || '').replace(/^@/, '').trim()),
        groomIg: e(String(r.groomIg || '').replace(/^@/, '').trim()),
        cover: e(safeUrl(r.coverPhoto) || safeUrl(r.bridePhoto) || UNS(DEMO_COVERS[0])),
        events,
        gifts: (r.gifts || []).filter(g => g && g.acc).map(g => ({ bank: e(g.bank || 'Rekening'), acc: e(g.acc), holder: e(g.holder || '') })),
        firstDate: events[0] ? events[0].date : '',
        firstVenue: events[0] ? events[0].venue : ''
      };
    }
    const d = prep(RAW);

    // ============================================================
    // 3. GAYA TEMA
    // ============================================================
    const FONTS = { serif: "'Cormorant Garamond', serif", royal: "'Cinzel', serif", edit: "'Space Grotesk', sans-serif", script: "'Caveat', cursive", cursive: "'Alex Brush', cursive", sans: "'Plus Jakarta Sans', sans-serif" };
    const NAME_SIZE = { cursive: 'text-5xl', script: 'text-5xl font-bold', royal: 'text-3xl tracking-wide', edit: 'text-4xl font-bold uppercase tracking-tighter', serif: 'text-4xl', sans: 'text-4xl font-semibold' };
    const nameCls = `fn ${NAME_SIZE[T.nameFont] || 'text-4xl'} leading-tight`;

    (function applyTheme() {
      const root = document.getElementById('themeRoot');
      const vars = { '--bg': T.bg, '--surface': T.surface, '--text': T.text, '--muted': T.muted, '--accent': T.accent, '--on': T.onAccent, '--border': T.border, '--fh': FONTS[T.head], '--fn': FONTS[T.nameFont], '--bs': T.dashed ? 'dashed' : 'solid', '--bw': T.dashed ? '2px' : '1px' };
      Object.entries(vars).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
      if (T.pattern) { root.style.backgroundImage = T.pattern; if (T.patternSize) root.style.backgroundSize = T.patternSize; }
      document.querySelector('meta[name="theme-color"]') || document.head.insertAdjacentHTML('beforeend', `<meta name="theme-color" content="${T.bg}">`);
    })();

    const QUOTES = {
      quran: { text: '“Dan di antara tanda-tanda kebesaran-Nya ialah Dia menciptakan pasangan-pasangan untukmu dari jenismu sendiri, agar kamu cenderung dan merasa tenteram kepadanya, dan Dia menjadikan di antaramu rasa kasih dan sayang.”', src: 'QS. Ar-Rum: 21' },
      cinta: { text: '“Dua jiwa, satu cerita. Dengan penuh rasa syukur, kami ingin berbagi kebahagiaan di hari yang paling berarti dalam hidup kami.”', src: '' }
    };

    // ============================================================
    // 4. BAGIAN-BAGIAN UNDANGAN
    // ============================================================
    const yearOf = () => (d.events[0] && d.events[0].iso ? d.events[0].iso.slice(0, 4) : new Date().getFullYear());

    function countdownHTML(style) {
      if (!d.events[0] || !d.events[0].iso) return '';
      const box = style === 'glass'
        ? 'bg-white/15 backdrop-blur-md border border-white/30 text-white'
        : 't-surface';
      const unit = (id, label) => `<div class="${box} rounded-2xl py-3 text-center"><span id="${id}" class="fh text-2xl font-bold block leading-none tabular-nums ${style === 'glass' ? '' : 't-accent'}">00</span><span class="text-[9px] uppercase tracking-wider mt-1 block opacity-75">${label}</span></div>`;
      return `<div id="countdownWrap" class="grid grid-cols-4 gap-2 max-w-xs mx-auto mt-7">${unit('cdD', 'Hari')}${unit('cdH', 'Jam')}${unit('cdM', 'Menit')}${unit('cdS', 'Detik')}</div>
              <p id="eventPassed" class="hidden max-w-xs mx-auto mt-6 text-xs t-muted">Alhamdulillah, acara telah berlangsung. Terima kasih atas doa dan kehadirannya.</p>`;
    }

    function heroHTML() {
      const L = T.layout;
      if (L === 'lengkung') return `
        <section id="sec-hero" class="pt-16 pb-12 px-6 text-center border-b t-line">
          <div class="reveal w-56 h-72 mx-auto rounded-t-full overflow-hidden p-1.5 t-ring shadow-lg"><img src="${d.cover}" alt="" class="w-full h-full object-cover rounded-t-full"></div>
          <div class="reveal text-[10px] uppercase tracking-[0.3em] font-bold t-accent mt-7">The Wedding Of</div>
          <h1 class="reveal ${nameCls} my-3">${d.brideNick} <span class="t-accent">&</span> ${d.groomNick}</h1>
          <p class="reveal text-xs t-muted tracking-wider">${d.firstDate}</p>
          ${countdownHTML()}
        </section>`;

      if (L === 'majalah') return `
        <section id="sec-hero" class="pt-14 px-6 pb-8 border-b-[3px]" style="border-color:var(--border)">
          <div class="flex justify-between text-[10px] font-bold tracking-widest border-b-2 pb-2 fh" style="border-color:var(--border)">
            <span>EST. ${yearOf()}</span><span>THE WEDDING ISSUE</span><span>${T.orn}</span>
          </div>
          <h1 class="reveal ${nameCls} text-5xl mt-5 leading-[.95]">${d.brideNick}<br>& ${d.groomNick}</h1>
          <div class="reveal mt-5 p-1 border-2 shadow-[6px_6px_0_var(--accent)]" style="border-color:var(--border)"><img src="${d.cover}" alt="" class="w-full aspect-[4/5] object-cover ${T.id === 'monochrome' || T.id === 'slate' ? 'grayscale contrast-125' : ''}"></div>
          <p class="reveal mt-4 text-xs uppercase font-bold tracking-widest t-muted">${d.firstDate} • ${d.firstVenue}</p>
          ${countdownHTML()}
        </section>`;

      if (L === 'polaroid') return `
        <section id="sec-hero" class="pt-16 pb-12 px-6 text-center border-b t-line">
          <div class="reveal fn text-3xl t-accent">Our Love Story Begins</div>
          <div class="reveal relative bg-white p-3 pb-10 shadow-xl rotate-[-3deg] max-w-[250px] mx-auto mt-6">
            <span class="absolute -top-3 left-1/2 -translate-x-1/2 w-20 h-6 bg-white/70 border border-black/5 rotate-[4deg]"></span>
            <img src="${d.cover}" alt="" class="w-full aspect-square object-cover">
            <span class="absolute bottom-2 inset-x-0 text-center text-xl text-stone-700" style="font-family:'Caveat',cursive">${d.brideNick} & ${d.groomNick}</span>
          </div>
          <h1 class="reveal ${nameCls} mt-8">${d.brideNick} <span class="t-accent">&</span> ${d.groomNick}</h1>
          <p class="reveal text-xs t-muted mt-2">${d.firstDate}</p>
          ${countdownHTML()}
        </section>`;

      if (L === 'sinema') return `
        <section id="sec-hero" class="relative min-h-[88vh] flex flex-col justify-end text-center px-6 pb-12 overflow-hidden">
          <img src="${d.cover}" alt="" class="absolute inset-0 w-full h-full object-cover">
          <div class="absolute inset-0" style="background:linear-gradient(to top, var(--bg) 0%, rgba(0,0,0,.45) 45%, rgba(0,0,0,.15) 100%)"></div>
          <div class="relative text-white">
            <span class="reveal inline-block text-[10px] uppercase font-bold tracking-[0.3em] bg-white/15 backdrop-blur-md border border-white/30 px-3.5 py-1 rounded-full">The Wedding Of</span>
            <h1 class="reveal ${nameCls} my-4 drop-shadow-lg">${d.brideNick} & ${d.groomNick}</h1>
            <p class="reveal text-xs tracking-widest uppercase opacity-90">${d.firstDate}</p>
            ${countdownHTML('glass')}
          </div>
        </section>`;

      // klasik
      return `
        <section id="sec-hero" class="pt-20 pb-14 px-6 text-center border-b t-line">
          <div class="reveal text-lg tracking-[0.4em] t-accent animate-float">${T.orn}</div>
          <div class="reveal text-[10px] uppercase tracking-[0.3em] font-bold t-accent mt-4">The Wedding Of</div>
          <h1 class="reveal ${nameCls} my-4">${d.brideNick}<br><span class="t-accent text-2xl">&</span><br>${d.groomNick}</h1>
          <p class="reveal text-xs t-muted tracking-wider">${d.firstDate}</p>
          ${countdownHTML()}
        </section>`;
    }

    function quoteHTML() {
      const q = QUOTES[T.quote] || QUOTES.cinta;
      return `
        <section class="py-12 px-8 text-center border-b t-line">
          <p class="reveal fh italic text-base leading-relaxed t-muted max-w-sm mx-auto">${q.text}</p>
          ${q.src ? `<p class="reveal text-xs font-semibold mt-3 t-accent">${q.src}</p>` : ''}
        </section>`;
    }

    function personHTML(who) {
      const photo = d[who + 'Photo'], full = d[who + 'Full'], parents = d[who + 'Parents'], ig = d[who + 'Ig'];
      const igLink = ig ? `<a href="https://instagram.com/${ig}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs t-accent font-semibold mt-2 hover:underline"><i data-lucide="instagram" class="w-3.5 h-3.5"></i> @${ig}</a>` : '';
      const L = T.layout;
      if (L === 'majalah') return `
        <div class="p-4 space-y-2">
          <div class="border-2 p-1 shadow-[4px_4px_0_var(--accent)]" style="border-color:var(--border)"><img src="${photo}" alt="${full}" loading="lazy" class="w-full aspect-[3/4] object-cover"></div>
          <h3 class="fh font-bold text-sm uppercase leading-snug">${full}</h3>
          <p class="text-[10px] t-muted">${parents}</p>${igLink}
        </div>`;
      if (L === 'polaroid') return `
        <div class="reveal bg-white p-3 pb-5 shadow-lg ${who === 'bride' ? 'rotate-[-2deg]' : 'rotate-[2deg]'} max-w-[260px] mx-auto text-stone-800">
          <img src="${photo}" alt="${full}" loading="lazy" class="w-full aspect-square object-cover">
          <h3 class="fn text-3xl mt-3" style="color:${T.accent}">${full}</h3>
          <p class="text-xs text-stone-500">${parents}</p>${igLink}
        </div>`;
      if (L === 'sinema') return `
        <div class="reveal t-surface backdrop-blur-md p-4 rounded-3xl flex items-center gap-4 text-left">
          <img src="${photo}" alt="${full}" loading="lazy" class="w-20 h-24 rounded-2xl object-cover shrink-0">
          <div><h3 class="fn text-2xl leading-tight">${full}</h3><p class="text-xs t-muted mt-1">${parents}</p>${igLink}</div>
        </div>`;
      const shape = L === 'lengkung' ? 'w-32 h-40 rounded-t-full' : 'w-28 h-28 rounded-full';
      return `
        <div class="reveal flex flex-col items-center">
          <div class="${shape} overflow-hidden p-1 t-ring shadow-md mb-4"><img src="${photo}" alt="${full}" loading="lazy" class="w-full h-full object-cover ${L === 'lengkung' ? 'rounded-t-full' : 'rounded-full'}"></div>
          <h3 class="fn text-3xl">${full}</h3>
          <p class="text-xs t-muted mt-1">${parents}</p>${igLink}
        </div>`;
    }

    function coupleHTML() {
      const intro = `<p class="reveal text-xs t-muted max-w-xs mx-auto leading-relaxed">Dengan memohon rahmat dan ridho Allah SWT, kami bermaksud menyelenggarakan pernikahan putra-putri kami:</p>`;
      const introUmum = `<p class="reveal text-xs t-muted max-w-xs mx-auto leading-relaxed">Dengan penuh sukacita, kami mengundang Bapak/Ibu/Saudara/i untuk hadir di hari pernikahan kami:</p>`;
      const head = T.quote === 'quran' ? intro : introUmum;
      if (T.layout === 'majalah') return `
        <section id="sec-couple" class="border-b-[3px] text-center" style="border-color:var(--border)">
          <div class="px-6 pt-10 pb-4">${head}</div>
          <div class="grid grid-cols-2 divide-x-[3px] text-left" style="border-color:var(--border)">${personHTML('bride')}${personHTML('groom')}</div>
        </section>`;
      return `
        <section id="sec-couple" class="py-14 px-6 text-center space-y-8 border-b t-line">
          ${head}
          ${personHTML('bride')}
          <div class="reveal fn text-4xl t-accent">&</div>
          ${personHTML('groom')}
        </section>`;
    }

    function calendarLink(ev) {
      if (!ev.iso) return '';
      const day = ev.iso.replace(/-/g, '');
      const next = new Date(ev.iso + 'T00:00:00'); next.setDate(next.getDate() + 1);
      const dayEnd = `${next.getFullYear()}${String(next.getMonth() + 1).padStart(2, '0')}${String(next.getDate()).padStart(2, '0')}`;
      const tmp = document.createElement('textarea');
      const plain = s => { tmp.innerHTML = s; return tmp.value; };
      const p = new URLSearchParams({ action: 'TEMPLATE', text: `${plain(ev.name)} ${plain(d.bride)} & ${plain(d.groom)}`, dates: `${day}/${dayEnd}`, location: plain(ev.venue), details: `${plain(ev.time)}\n${location.href}` });
      return escapeHTML('https://calendar.google.com/calendar/render?' + p.toString());
    }

    function eventsHTML() {
      if (!d.events.length) return '';
      const majalah = T.layout === 'majalah';
      const cards = d.events.map(ev => `
        <div class="reveal ${majalah ? 'border-2 border-dashed' : 't-surface rounded-3xl'} p-6 space-y-3 text-xs" ${majalah ? 'style="border-color:var(--border)"' : ''}>
          <h3 class="fh text-xl font-semibold t-accent">${ev.name}</h3>
          <div class="space-y-2">
            ${ev.date ? `<div class="flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4 t-accent shrink-0"></i><span>${ev.date}</span></div>` : ''}
            ${ev.time ? `<div class="flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4 t-accent shrink-0"></i><span>${ev.time}</span></div>` : ''}
            ${ev.venue ? `<div class="flex items-start gap-2"><i data-lucide="map-pin" class="w-4 h-4 t-accent shrink-0 mt-0.5"></i><strong>${ev.venue}</strong></div>` : ''}
          </div>
          <div class="grid ${ev.iso ? 'grid-cols-2' : 'grid-cols-1'} gap-2 pt-1">
            <a href="${ev.maps}" target="_blank" rel="noopener" class="t-btn inline-flex items-center justify-center gap-1.5 py-2.5 ${majalah ? '' : 'rounded-xl'} font-bold"><i data-lucide="navigation" class="w-3.5 h-3.5"></i> Buka Maps</a>
            ${ev.iso ? `<a href="${calendarLink(ev)}" target="_blank" rel="noopener" class="t-outline inline-flex items-center justify-center gap-1.5 py-2.5 ${majalah ? '' : 'rounded-xl'} font-bold"><i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i> Simpan</a>` : ''}
          </div>
        </div>`).join('');
      return `
        <section id="sec-event" class="py-14 px-6 border-b t-line space-y-5">
          <div class="reveal text-center"><span class="text-[10px] uppercase tracking-[0.3em] font-bold t-accent">Save The Date</span><h2 class="fh text-3xl mt-1">Rangkaian Acara</h2></div>
          ${cards}
        </section>`;
    }

    function giftHTML() {
      if (!d.gifts.length) return '';
      return `
        <section id="sec-gift" class="py-14 px-6 border-b t-line text-center space-y-5">
          <div class="reveal"><span class="text-[10px] uppercase tracking-[0.3em] font-bold t-accent">Tanda Kasih</span><h2 class="fh text-3xl mt-1">Amplop Digital</h2>
            <p class="text-xs t-muted max-w-xs mx-auto mt-2 leading-relaxed">Doa restu Anda adalah karunia terindah bagi kami. Bagi yang ingin memberikan tanda kasih secara digital:</p></div>
          ${d.gifts.map(g => `
            <div class="reveal t-surface rounded-2xl p-5 text-left text-xs">
              <div class="flex justify-between items-center gap-3">
                <span class="font-bold uppercase tracking-wider t-accent">${g.bank}</span>
                <button type="button" data-acc="${g.acc}" onclick="copyAcc(this)" class="t-outline inline-flex items-center gap-1 px-3 py-1 rounded-lg text-[11px] font-semibold"><i data-lucide="copy" class="w-3 h-3"></i> Salin</button>
              </div>
              <div class="font-mono text-lg font-bold tracking-wider my-1">${g.acc}</div>
              ${g.holder ? `<div class="t-muted">a.n. ${g.holder}</div>` : ''}
            </div>`).join('')}
        </section>`;
    }

    function rsvpHTML() {
      return `
        <section id="sec-rsvp" class="py-14 px-6 space-y-5 text-xs">
          <div class="reveal text-center"><span class="text-[10px] uppercase tracking-[0.3em] font-bold t-accent">Konfirmasi & Doa</span><h2 class="fh text-3xl mt-1">Buku Tamu & RSVP</h2></div>
          <form onsubmit="handleWish(event)" class="reveal t-surface rounded-3xl p-5 space-y-3">
            <label class="block"><span class="font-semibold">Nama</span><input id="wName" required maxlength="60" placeholder="Tuliskan nama Anda" class="t-input w-full p-2.5 rounded-xl mt-1"></label>
            <label class="block"><span class="font-semibold">Kehadiran</span>
              <select id="wStatus" class="t-input w-full p-2.5 rounded-xl mt-1"><option value="Hadir">Insya Allah hadir</option><option value="Tidak Hadir">Mohon maaf, tidak bisa hadir</option><option value="Masih Ragu">Masih ragu</option></select></label>
            <label class="block"><span class="font-semibold">Ucapan & doa</span><textarea id="wMsg" required rows="3" maxlength="500" placeholder="Tuliskan ucapan dan doa terbaik..." class="t-input w-full p-2.5 rounded-xl mt-1 resize-none"></textarea></label>
            <button class="t-btn w-full py-3 rounded-xl font-bold uppercase tracking-wider">Kirim Ucapan</button>
          </form>
          <div id="rsvpNotice"></div>
          <div id="wishesBox" class="space-y-2 max-h-80 overflow-y-auto pr-1" aria-live="polite"></div>
        </section>`;
    }

    function footerHTML() {
      return `
        <footer class="pt-6 pb-10 px-6 text-center">
          <p class="fh italic text-lg">Terima kasih</p>
          <p class="fn text-3xl t-accent mt-1">${d.brideNick} & ${d.groomNick}</p>
          <p class="text-[10px] t-muted mt-6">Undangan digital oleh <a href="dibuatin.html" class="font-bold t-accent">di.buat.in</a> • by di.raya.in</p>
        </footer>`;
    }

    // ============================================================
    // 5. RENDER
    // ============================================================
    function render() {
      document.getElementById('templateRoot').innerHTML =
        heroHTML() + quoteHTML() + coupleHTML() + eventsHTML() + giftHTML() + rsvpHTML() + footerHTML();

      const names = `${d.brideNick} & ${d.groomNick}`;
      const tmp = document.createElement('textarea'); tmp.innerHTML = names;
      document.title = `The Wedding of ${tmp.value}`;

      // Sampul
      document.getElementById('coverCard').innerHTML = `
        <span class="text-[10px] uppercase tracking-[0.3em] font-bold t-accent">The Wedding Of</span>
        <h1 class="${nameCls}">${names}</h1>
        <div class="w-28 h-28 rounded-full overflow-hidden p-1 t-ring shadow-lg"><img src="${d.cover}" alt="" class="w-full h-full object-cover rounded-full"></div>
        <div class="w-full">
          <p class="text-xs t-muted mb-1.5">Kepada Yth. Bapak/Ibu/Saudara/i:</p>
          <div class="t-surface px-4 py-2.5 rounded-2xl text-sm font-bold break-words t-accent">${GUEST ? escapeHTML(GUEST) : 'Tamu Undangan'}</div>
          ${GUEST ? '<p class="text-[10px] t-muted mt-1.5">Mohon maaf apabila ada kesalahan penulisan nama/gelar</p>' : ''}
        </div>
        <button type="button" onclick="openInvitation()" class="t-btn w-full py-3.5 rounded-full font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg">
          <i data-lucide="mail-open" class="w-4 h-4"></i> Buka Undangan
        </button>`;

      // Panel kiri desktop
      const unesc = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
      document.getElementById('desktopBg').src = unesc(d.cover);
      document.getElementById('desktopNames').innerHTML = names;
      document.getElementById('desktopDate').innerHTML = d.firstDate;
      document.getElementById('desktopVenue').innerHTML = d.firstVenue;

      // Navigasi bawah (hanya bagian yang ada)
      const NAV = [['sec-hero', 'home', 'Sampul'], ['sec-couple', 'heart', 'Mempelai'], ['sec-event', 'calendar', 'Acara'], ['sec-gift', 'gift', 'Amplop'], ['sec-rsvp', 'message-circle', 'Ucapan']];
      document.getElementById('bottomNavInner').innerHTML = NAV.filter(n => document.getElementById(n[0]))
        .map(n => `<a href="#${n[0]}" class="flex flex-col items-center gap-0.5 px-1 hover:text-amber-300 transition-colors"><i data-lucide="${n[1]}" class="w-4 h-4"></i><span>${n[2]}</span></a>`).join('');

      // Mode
      if (MODE === 'preview') {
        document.getElementById('previewBanner').classList.remove('hidden');
        document.getElementById('watermark').classList.remove('hidden');
      }
      if (MODE === 'demo') {
        document.getElementById('demoBanner').classList.remove('hidden');
        document.getElementById('demoThemeName').textContent = T.name;
        document.getElementById('demoOrderLink').href = `dibuatin.html?tema=${encodeURIComponent(T.id)}#order`;
      }
      if (GUEST) {
        const w = document.getElementById('wName'); if (w) w.value = GUEST;
      }

      lucide.createIcons();
      renderWishes();
      startCountdown();
      const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('revealed'); io.unobserve(en.target); } }), { threshold: 0.1 });
      document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }

    // ============================================================
    // 6. INTERAKSI
    // ============================================================
    // Hitung mundur ke acara pertama
    function startCountdown() {
      const ev = d.events[0];
      if (!ev || !ev.iso || !document.getElementById('cdD')) return;
      const tm = (RAW.events[0].time || '').match(/(\d{1,2})[.:](\d{2})/);
      const target = new Date(`${ev.iso}T${tm ? tm[1].padStart(2, '0') + ':' + tm[2] : '08:00'}:00+07:00`).getTime();
      const pad = n => String(n).padStart(2, '0');
      const tick = () => {
        const diff = target - Date.now();
        if (diff <= 0) {
          document.getElementById('countdownWrap').classList.add('hidden');
          document.getElementById('eventPassed').classList.remove('hidden');
          clearInterval(timer); return;
        }
        document.getElementById('cdD').textContent = pad(Math.floor(diff / 864e5));
        document.getElementById('cdH').textContent = pad(Math.floor(diff % 864e5 / 36e5));
        document.getElementById('cdM').textContent = pad(Math.floor(diff % 36e5 / 6e4));
        document.getElementById('cdS').textContent = pad(Math.floor(diff % 6e4 / 1e3));
      };
      const timer = setInterval(tick, 1000); tick();
    }

    // Musik
    const bgMusic = document.getElementById('bgMusic');
    const MUSIC_SRC = safeUrl(RAW.musicUrl) || musikUrl('romantic-piano');
    let isPlaying = false, pausedByHide = false;

    function setMusicUI() {
      document.getElementById('vinylDisc').classList.toggle('vinyl-spin', isPlaying);
      document.getElementById('musicLabel').textContent = isPlaying ? 'Musik ON' : 'Musik OFF';
    }
    function playMusic() {
      if (!bgMusic.src) bgMusic.src = MUSIC_SRC;
      bgMusic.play().then(() => { isPlaying = true; setMusicUI(); }).catch(() => { isPlaying = false; setMusicUI(); });
    }
    function toggleMusic() {
      if (isPlaying) { bgMusic.pause(); isPlaying = false; setMusicUI(); } else playMusic();
    }
    bgMusic.addEventListener('error', () => { document.getElementById('musicChip').classList.add('hidden'); isPlaying = false; });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isPlaying) { bgMusic.pause(); isPlaying = false; pausedByHide = true; setMusicUI(); }
      else if (!document.hidden && pausedByHide) { pausedByHide = false; playMusic(); }
    });

    function openInvitation() {
      const modal = document.getElementById('coverModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => modal.classList.add('hidden'), 700);
      document.body.classList.remove('locked');
      const chip = document.getElementById('musicChip');
      chip.classList.remove('hidden'); chip.classList.add('flex');
      playMusic();
    }

    // Salin rekening
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.remove('hidden');
      clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2200);
    }
    function copyAcc(btn) {
      const text = btn.dataset.acc;
      const ok = () => toast('Nomor rekening disalin ✓');
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok).catch(() => fallbackCopy(text) && ok());
      else if (fallbackCopy(text)) ok();
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove(); return ok;
    }

    // Buku tamu
    let wishes = MODE === 'demo'
      ? [{ name: 'Keluarga Besar', status: 'Hadir', msg: 'Barakallahu lakuma, semoga menjadi keluarga yang sakinah, mawaddah, warahmah.' }]
      : [];
    const STATUS_CLS = { 'Hadir': 'bg-emerald-100 text-emerald-800', 'Tidak Hadir': 'bg-red-100 text-red-800', 'Masih Ragu': 'bg-amber-100 text-amber-800' };

    function renderWishes() {
      const box = document.getElementById('wishesBox');
      if (!box) return;
      box.innerHTML = wishes.map(w => `
        <div class="t-surface rounded-xl p-3 space-y-1">
          <div class="flex justify-between items-center gap-2"><strong class="break-words">${escapeHTML(w.name)}</strong><span class="shrink-0 text-[10px] px-2 py-0.5 rounded font-bold ${STATUS_CLS[w.status] || ''}">${escapeHTML(w.status)}</span></div>
          <p class="t-muted break-words">${escapeHTML(w.msg)}</p>
        </div>`).join('');
    }

    function handleWish(e) {
      e.preventDefault();
      const name = document.getElementById('wName').value.trim();
      const status = document.getElementById('wStatus').value;
      const msg = document.getElementById('wMsg').value.trim();
      if (!name || !msg) return;
      wishes.unshift({ name, status, msg });
      renderWishes();
      document.getElementById('wMsg').value = '';

      // Kirim juga ke WhatsApp mempelai, supaya konfirmasi tamu tidak hilang
      const notice = document.getElementById('rsvpNotice');
      const wa = normalizeWa(RAW.wa);
      if (MODE === 'live' && wa.length >= 10) {
        const text = `Assalamu'alaikum, saya *${name}* ingin konfirmasi kehadiran di pernikahan ${firstName(RAW.bride)} & ${firstName(RAW.groom)}.\n\nKehadiran: *${status}*\nUcapan: ${msg}`;
        notice.innerHTML = `<a href="https://wa.me/${wa}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 w-full py-3 rounded-xl font-bold text-white bg-[#25D366]"><i data-lucide="send" class="w-4 h-4"></i> Kirim konfirmasi ke WhatsApp mempelai</a>`;
        lucide.createIcons();
      } else {
        notice.innerHTML = `<p class="text-center t-muted">Terima kasih atas ucapannya! 🤍</p>`;
      }
    }

    render();
  </script>
</body>
</html>
