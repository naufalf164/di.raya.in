<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — di.buat.in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { cream: '#FAF8F5', warm: '#F4EFEA', sand: '#E8DFD8', gold: '#662626', charcoal: '#23201E', muted: '#716B67' } } } }
    }
  </script>
</head>
<body class="bg-brand-warm text-brand-charcoal min-h-screen p-4 sm:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-brand-cream p-6 rounded-3xl border border-brand-sand flex items-center justify-between">
      <div>
        <span class="text-[10px] font-bold text-brand-gold uppercase">Panel Manajemen</span>
        <h1 class="text-2xl font-bold text-brand-charcoal">Verifikasi Pesanan di.buat.in</h1>
      </div>
      <a href="dibuatin.html" class="text-xs font-semibold px-4 py-2 bg-brand-warm rounded-full border border-brand-sand">Lihat Web ↗</a>
    </div>

    <!-- Kotak Input Token WA -->
    <div class="bg-brand-cream p-6 rounded-3xl border border-brand-sand space-y-3">
      <h2 class="text-sm font-bold text-brand-charcoal flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4 text-brand-gold"></i> Paste Pesan / Token dari WhatsApp Klien
      </h2>
      <div class="flex gap-2">
        <input type="text" id="tokenInp" placeholder="Paste baris #DATA:... dari WhatsApp di sini" class="flex-1 px-4 py-2.5 bg-white border border-brand-sand rounded-xl text-xs font-mono outline-none">
        <button onclick="loadToken()" class="px-5 py-2.5 bg-brand-gold text-white text-xs font-semibold rounded-xl hover:bg-brand-goldDark">Muat</button>
      </div>
    </div>

    <!-- Daftar Pesanan -->
    <div class="bg-brand-cream p-6 rounded-3xl border border-brand-sand space-y-4">
      <h2 class="text-base font-bold text-brand-charcoal">Daftar Undangan yang Disetujui</h2>
      <div id="adminList" class="space-y-4"></div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function loadToken() {
      let raw = document.getElementById('tokenInp').value.trim();
      if (!raw) return;
      if (raw.includes('#DATA:')) raw = raw.split('#DATA:')[1].trim();

      try {
        const order = JSON.parse(decodeURIComponent(atob(raw)));
        localStorage.setItem('dbi_order_' + order.slug, JSON.stringify(order));
        document.getElementById('tokenInp').value = '';
        renderOrders();
        alert(`Pesanan ${order.id} (${order.bride} & ${order.groom}) berhasil dimuat!`);
      } catch(e) {
        alert('Format token tidak valid.');
      }
    }

    function renderOrders() {
      const container = document.getElementById('adminList');
      container.innerHTML = '';
      const orders = [];

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('dbi_order_')) {
          try { orders.push(JSON.parse(localStorage.getItem(key))); } catch(e){}
        }
      }

      if (orders.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-xs text-brand-muted">Belum ada pesanan aktif.</div>';
        return;
      }

      orders.forEach(o => {
        const link = `${window.location.origin}/undangan.html?id=${o.slug}`;
        const card = document.createElement('div');
        card.className = "p-4 bg-brand-warm rounded-2xl border border-brand-sand space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-bold font-mono px-2 py-0.5 rounded bg-white border border-brand-sand text-brand-gold">${o.id}</span>
              <h3 class="text-base font-bold text-brand-charcoal mt-1">${o.bride} & ${o.groom}</h3>
              <p class="text-xs text-brand-muted">Tema: ${o.theme} • Nominal: Rp${o.price.toLocaleString('id-ID')}</p>
            </div>
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">Aktif</span>
          </div>

          <div class="text-xs bg-white p-3 rounded-xl border border-brand-sand/60 space-y-1">
            <div><strong>Tautan Undangan:</strong> <a href="${link}" target="_blank" class="text-brand-gold underline">${link}</a></div>
            <div><strong>Amplop:</strong> ${o.bankAcc ? `${o.bankName} - ${o.bankAcc} (a.n. ${o.bankHolder})` : '<em class="text-brand-muted">Dikosongkan / Tidak Ada</em>'}</div>
          </div>

          <div class="flex gap-2">
            <a href="${link}" target="_blank" class="px-3.5 py-1.5 bg-brand-charcoal text-white text-xs rounded-lg">Buka</a>
            <button onclick="sendToClient('${o.wa}', '${o.bride}', '${link}')" class="px-3.5 py-1.5 bg-[#25D366] text-white text-xs font-semibold rounded-lg">Kirim Link ke WA Pengantin</button>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function sendToClient(wa, name, link) {
      let clean = wa.replace(/[^0-9]/g, '');
      if (clean.startsWith('0')) clean = '62' + clean.slice(1);
      const text = `Halo Kak *${name}*, pembayaran telah kami verifikasi dan undangan digital Anda resmi aktif!\n\n👉 *Link Undangan:* ${link}\n👉 *Format Sebar Tamu:* ${link}&to=Nama+Tamu\n\nSelamat menyebarkan kabar bahagia!`;
      window.open(`https://wa.me/${clean}?text=${encodeURIComponent(text)}`, '_blank');
    }

    renderOrders();
  </script>
</body>
</html>
